<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0e1628">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PERT">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>PERT Planner</title>
<style>

:root {
  --bg:#0e1628; --surface:#1a2540; --card:#1e2d47; --border:#2e3d5a;
  --accent:#f5a623; --accent2:#e05c7a; --accent3:#5bc4f5;
  --text:#e8eef5; --muted:#6a7fa0; --critical:#e05c7a;
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body { background:var(--bg); color:var(--text); font-family:'Courier New',Courier,monospace; height:100dvh; display:flex; flex-direction:column; overflow:hidden; }

.btn { background:var(--card); border:1px solid var(--border); color:var(--text); font-family:'Courier New',Courier,monospace; font-size:11px; padding:7px 12px; border-radius:7px; cursor:pointer; white-space:nowrap; transition:all 0.15s; }
.btn:active { transform:scale(0.95); opacity:0.8; }
.btn.primary { background:var(--accent); color:#0e1628; border-color:var(--accent); font-weight:700; }
.btn.danger  { background:rgba(224,92,122,0.15); color:var(--accent2); border-color:var(--accent2); }
.btn.sm      { padding:5px 9px; font-size:10px; }

#projectScreen { display:flex; flex-direction:column; flex:1; overflow:hidden; }
.proj-header { padding:18px 16px 14px; border-bottom:2px solid var(--accent); background:var(--bg); flex-shrink:0; }
.proj-header h1 { font-family:-apple-system,'SF Pro Display',Arial,sans-serif; font-size:22px; font-weight:800; color:var(--accent); letter-spacing:-0.5px; }
.proj-header p { font-size:11px; color:var(--muted); margin-top:3px; letter-spacing:.1em; text-transform:uppercase; }
.proj-list { flex:1; overflow-y:auto; padding:16px; -webkit-overflow-scrolling:touch; }
.proj-card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:12px; cursor:pointer; transition:border-color 0.15s; }
.proj-card:active { transform:scale(0.98); }
.proj-card:hover { border-color:var(--accent); }
.proj-card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
.proj-name { font-family:-apple-system,'SF Pro Display',Arial,sans-serif; font-size:15px; font-weight:700; color:var(--text); }
.proj-meta { font-size:10px; color:var(--muted); margin-top:5px; }
.proj-badge { font-size:9px; padding:3px 8px; border-radius:20px; background:rgba(245,166,35,0.12); color:var(--accent); border:1px solid rgba(245,166,35,0.3); white-space:nowrap; flex-shrink:0; }
.proj-actions { display:flex; gap:6px; margin-top:12px; }
.color-dot { width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:6px; }
.proj-new-btn { width:100%; padding:16px; background:transparent; border:1.5px dashed var(--border); border-radius:14px; color:var(--muted); font-family:'Courier New',Courier,monospace; font-size:12px; cursor:pointer; text-align:center; transition:all 0.15s; }
.proj-new-btn:active,.proj-new-btn:hover { border-color:var(--accent); color:var(--accent); }

#appScreen { display:none; flex-direction:column; flex:1; overflow:hidden; }
#appScreen.visible { display:flex; }
header { display:flex; align-items:center; padding:10px 12px; border-bottom:2px solid var(--accent); background:var(--bg); flex-shrink:0; gap:8px; }
.back-btn { background:none; border:1px solid var(--border); color:var(--accent); font-size:16px; width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
.header-title { flex:1; min-width:0; }
.header-title h1 { font-family:-apple-system,'SF Pro Display',Arial,sans-serif; font-size:15px; font-weight:800; color:var(--accent); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.header-title p { font-size:9px; color:var(--muted); letter-spacing:.1em; text-transform:uppercase; }
.header-actions { display:flex; gap:4px; flex-shrink:0; align-items:center; }

.tabs { display:flex; border-bottom:1px solid var(--border); background:var(--bg); flex-shrink:0; }
.tab { flex:1; padding:10px 4px; text-align:center; font-size:10px; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; transition:all 0.15s; letter-spacing:.06em; text-transform:uppercase; }
.tab.active { color:var(--accent); border-bottom-color:var(--accent); }
.view { display:none; flex:1; overflow:hidden; flex-direction:column; }
.view.active { display:flex; }

#canvas-wrap { flex:1; overflow:hidden; position:relative; background:radial-gradient(circle at 15% 85%,rgba(245,166,35,0.06) 0%,transparent 50%),radial-gradient(circle at 85% 15%,rgba(91,196,245,0.04) 0%,transparent 50%),var(--bg); }
#canvas { position:absolute; top:0; left:0; width:100%; height:100%; }
.node { position:absolute; background:var(--card); border:1.5px solid var(--border); border-radius:10px; cursor:pointer; user-select:none; touch-action:none; overflow:hidden; display:flex; flex-direction:column; justify-content:center; transition:border-color 0.15s,box-shadow 0.15s; }
.node.critical { border-color:var(--critical); box-shadow:0 0 12px rgba(224,92,122,0.3); }
.node.fin-node { border-style:double; border-width:3px; background:var(--surface); }
.node-inner { padding:5px 7px; overflow:hidden; width:100%; }
.node-id    { color:var(--muted); letter-spacing:0.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.node-name  { font-weight:500; color:var(--text); line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.node-times { display:flex; gap:2px; white-space:nowrap; overflow:hidden; }
.node-es { color:var(--accent); } .node-ls { color:var(--accent2); } .node-dur { color:var(--accent3); }
.node-slack { color:var(--muted); white-space:nowrap; } .node-slack.zero { color:var(--critical); }
svg#arrows { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
.arrow { fill:none; stroke:var(--border); stroke-width:1.5; marker-end:url(#ah); }
.arrow.critical { stroke:var(--critical); stroke-width:2.5; opacity:0.9; }
.canvas-controls { position:absolute; bottom:50px; right:12px; display:flex; flex-direction:column; gap:6px; z-index:10; }
.canvas-controls .btn { width:38px; height:38px; padding:0; display:flex; align-items:center; justify-content:center; font-size:18px; border-radius:50%; }
.info-bar { background:var(--surface); border-top:1px solid var(--border); padding:7px 14px; font-size:10px; color:var(--muted); display:flex; justify-content:space-between; flex-shrink:0; gap:6px; overflow:hidden; }
.info-bar span { color:var(--accent); }
.info-crit { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.connect-banner { display:none; background:rgba(245,166,35,0.12); border-bottom:1px solid var(--accent); color:var(--accent); font-size:11px; padding:7px 14px; align-items:center; justify-content:center; gap:8px; flex-shrink:0; }
.connect-banner.show { display:flex; }
.form-view { flex:1; overflow-y:auto; padding:16px; -webkit-overflow-scrolling:touch; }
.field { margin-bottom:10px; }
.field label { display:block; font-size:10px; color:var(--muted); margin-bottom:4px; letter-spacing:0.5px; text-transform:uppercase; }
.field input { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:7px; color:var(--text); font-family:'Courier New',Courier,monospace; font-size:13px; padding:9px 11px; outline:none; transition:border-color 0.15s; }
.field input:focus { border-color:var(--accent); }
.multi-check { display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
.check-pill { background:var(--bg); border:1px solid var(--border); border-radius:20px; padding:5px 10px; font-size:11px; cursor:pointer; transition:all 0.15s; }
.check-pill.selected { background:rgba(245,166,35,0.18); border-color:var(--accent); color:var(--accent); }
.task-item { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin-bottom:8px; display:flex; align-items:center; gap:10px; }
.task-item.critical { border-left:3px solid var(--critical); }
.task-info { flex:1; min-width:0; }
.task-name { font-size:12px; font-weight:500; margin-bottom:2px; }
.task-meta { font-size:10px; color:var(--muted); }
.task-actions { display:flex; gap:6px; flex-shrink:0; }
.icon-btn { background:none; border:1px solid var(--border); color:var(--muted); border-radius:6px; width:30px; height:30px; display:flex; align-items:center; justify-content:center; font-size:14px; cursor:pointer; }
.icon-btn:hover { border-color:var(--accent); color:var(--accent); }
.stats-view { flex:1; overflow-y:auto; padding:16px; -webkit-overflow-scrolling:touch; }
.stat-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:12px; }
.stat-card h3 { font-family:-apple-system,'SF Pro Display',Arial,sans-serif; font-size:11px; color:var(--muted); margin-bottom:10px; letter-spacing:1px; text-transform:uppercase; }
.stat-big { font-family:-apple-system,'SF Pro Display',Arial,sans-serif; font-size:36px; font-weight:800; color:var(--accent); line-height:1; }
.stat-sub { font-size:11px; color:var(--muted); margin-top:4px; }
.critical-path { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.cp-node { background:rgba(224,92,122,0.15); border:1px solid var(--critical); border-radius:6px; padding:4px 9px; font-size:11px; color:var(--critical); }
.cp-arrow { color:var(--muted); font-size:14px; display:flex; align-items:center; }

/* GANTT */
.gantt-view { flex:1; overflow:hidden; display:flex; flex-direction:column; }
.gantt-scroll { flex:1; overflow:auto; -webkit-overflow-scrolling:touch; position:relative; }
.gantt-container { display:flex; min-width:100%; }
.gantt-labels { flex-shrink:0; width:110px; border-right:1px solid var(--border); background:var(--bg); position:sticky; left:0; z-index:10; }
.gantt-label-header { height:36px; border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 8px; font-size:9px; color:var(--muted); letter-spacing:1px; text-transform:uppercase; background:var(--surface); }
.gantt-label-row { height:36px; border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 8px; gap:5px; cursor:pointer; }
.gantt-label-row:hover { background:var(--card); }
.gantt-label-text { font-size:11px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }
.gantt-label-text.critical { color:var(--critical); }
.gantt-grid { flex:1; position:relative; }
.gantt-header-row { display:flex; height:36px; border-bottom:1px solid var(--border); background:var(--surface); position:sticky; top:0; z-index:5; }
.gantt-col-head { flex-shrink:0; height:36px; display:flex; align-items:center; justify-content:center; font-size:9px; color:var(--muted); border-right:1px solid var(--border); }
.gantt-row { display:flex; height:36px; border-bottom:1px solid var(--border); position:relative; }
.gantt-cell { flex-shrink:0; height:36px; border-right:1px solid rgba(46,61,90,0.5); }
.gantt-cell.weekend { background:rgba(46,61,90,0.3); }
.gantt-bar-wrap { position:absolute; top:6px; height:24px; z-index:3; }
.gantt-bar { height:100%; border-radius:5px; display:flex; align-items:center; padding:0 6px; font-size:9px; font-weight:500; white-space:nowrap; overflow:hidden; cursor:pointer; }
.gantt-bar.es { background:rgba(245,166,35,0.85); color:#0e1628; }
.gantt-bar.es.critical { background:rgba(224,92,122,0.9); color:#fff; }
.gantt-bar.slack { background:rgba(46,61,90,0.7); color:var(--muted); border:1px dashed var(--border); }
.gantt-legend { display:flex; gap:12px; padding:7px 14px; border-top:1px solid var(--border); background:var(--surface); flex-shrink:0; font-size:10px; color:var(--muted); flex-wrap:wrap; }
.gantt-legend-item { display:flex; align-items:center; gap:5px; }
.gantt-legend-dot { width:12px; height:10px; border-radius:3px; flex-shrink:0; }

.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:200; align-items:flex-end; }
.modal-overlay.open { display:flex; }
.modal { background:var(--surface); border:1px solid var(--accent); border-radius:16px 16px 0 0; padding:20px 16px 32px; width:100%; max-height:85dvh; overflow-y:auto; }
.modal h2 { font-family:-apple-system,'SF Pro Display',Arial,sans-serif; font-size:16px; color:var(--accent); margin-bottom:16px; }
.modal-actions { display:flex; gap:8px; margin-top:16px; }
.modal-actions .btn { flex:1; padding:12px; font-size:13px; text-align:center; }
.empty-state { text-align:center; padding:40px 20px; color:var(--muted); font-size:13px; line-height:1.8; }
.empty-state .icon { font-size:40px; margin-bottom:12px; }

.detail-title { font-family:-apple-system,'SF Pro Display',Arial,sans-serif; font-size:20px; font-weight:800; color:var(--accent); margin-bottom:4px; }
.detail-id { font-size:10px; color:var(--muted); letter-spacing:1px; margin-bottom:16px; text-transform:uppercase; }
.detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
.detail-cell { background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
.detail-cell.critical { border-color:var(--critical); background:rgba(224,92,122,0.08); }
.detail-cell.ok { border-color:#27ae60; background:rgba(39,174,96,0.08); }
.detail-label { font-size:9px; color:var(--muted); letter-spacing:0.8px; text-transform:uppercase; margin-bottom:4px; }
.detail-value { font-family:-apple-system,'SF Pro Display',Arial,sans-serif; font-size:22px; font-weight:800; color:var(--text); line-height:1; }
.detail-value.accent { color:var(--accent); } .detail-value.accent3 { color:var(--accent3); } .detail-value.red { color:var(--critical); } .detail-value.green { color:#27ae60; }
.detail-sub { font-size:10px; color:var(--muted); margin-top:3px; }
.detail-explain { background:rgba(245,166,35,0.08); border:1px solid rgba(245,166,35,0.25); border-radius:10px; padding:12px; font-size:11px; color:var(--text); line-height:1.7; margin-bottom:12px; }
.detail-explain b { color:var(--accent); }
.detail-preds { background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:4px; }
.detail-preds-label { font-size:9px; color:var(--muted); letter-spacing:0.8px; text-transform:uppercase; margin-bottom:6px; }
.pred-tag { display:inline-block; background:var(--card); border:1px solid var(--border); border-radius:6px; padding:3px 8px; font-size:11px; margin:2px 3px 2px 0; }
.detail-critical-badge { display:inline-block; background:rgba(224,92,122,0.15); border:1px solid var(--critical); border-radius:20px; padding:4px 12px; font-size:11px; color:var(--critical); font-weight:500; margin-bottom:14px; }
.detail-ok-badge { display:inline-block; background:rgba(39,174,96,0.12); border:1px solid #27ae60; border-radius:20px; padding:4px 12px; font-size:11px; color:#27ae60; font-weight:500; margin-bottom:14px; }
</style>
</head>
<body>

<!-- PROJECT SCREEN -->
<div id="projectScreen">
  <div class="proj-header">
    <h1>&#9672; PERT Planner</h1>
    <p>Vos projets &mdash; donn&eacute;es conserv&eacute;es localement</p>
  </div>
  <div class="proj-list" id="projList"></div>
</div>

<!-- APP SCREEN -->
<div id="appScreen">
  <header>
    <button class="back-btn" id="btnBack">&#8592;</button>
    <div class="header-title">
      <h1 id="headerProjName">Projet</h1>
      <p id="headerProjSub"></p>
    </div>
    <div class="header-actions">
      <button class="btn sm" id="btnSettings" title="Param&egrave;tres">&#9881;</button>
      <button class="btn sm" id="btnLayout" title="Auto-layout">&#8859;</button>
      <button class="btn sm" id="btnConnect" title="Lier">&#8674;</button>
      <button class="btn sm" id="btnPDF" title="PDF">&#128196;</button>
      <button class="btn sm primary" id="btnAdd">&#65291;</button>
    </div>
  </header>

  <div class="tabs">
    <div class="tab active" data-view="graph">Graphe</div>
    <div class="tab" data-view="tasks">T&acirc;ches</div>
    <div class="tab" data-view="stats">Analyse</div>
    <div class="tab" data-view="gantt">Gantt</div>
  </div>

  <div class="connect-banner" id="connectBanner">
    Touchez source puis cible
    <button class="btn sm" id="btnCancelConnect">&#10005;</button>
  </div>

  <div class="view active" id="view-graph">
    <div id="canvas-wrap">
      <svg id="arrows">
        <defs>
          <marker id="ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e3d5a"/></marker>
          <marker id="ahc" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#e05c7a"/></marker>
        </defs>
      </svg>
      <div id="canvas"></div>
      <div class="canvas-controls">
        <button class="btn" id="btnZoomIn">+</button>
        <button class="btn" id="btnZoomOut">-</button>
        <button class="btn" id="btnFit">&#8861;</button>
      </div>
    </div>
    <div class="info-bar">
      <div>T: <span id="infoCount">0</span></div>
      <div>Dur&eacute;e: <span id="infoDuration">0</span><span id="infoDurUnit">j</span></div>
      <div class="info-crit">Critique: <span id="infoCritical">&mdash;</span></div>
    </div>
  </div>

  <div class="view" id="view-tasks">
    <div style="padding:10px 14px 0;flex-shrink:0">
      <button onclick="exportPDF()" style="width:100%;padding:10px;background:var(--accent);border:none;border-radius:10px;color:#0e1628;font-family:'Courier New',Courier,monospace;font-size:12px;font-weight:700;cursor:pointer;">&#128196; Exporter en PDF</button>
    </div>
    <div class="form-view" id="taskList"></div>
  </div>

  <div class="view" id="view-stats">
    <div style="padding:10px 14px 0;flex-shrink:0">
      <button onclick="exportPDF()" style="width:100%;padding:10px;background:var(--accent);border:none;border-radius:10px;color:#0e1628;font-family:'Courier New',Courier,monospace;font-size:12px;font-weight:700;cursor:pointer;">&#128196; Exporter en PDF</button>
    </div>
    <div class="stats-view" id="statsContent"></div>
  </div>

  <div class="view" id="view-gantt">
    <div class="gantt-view">
      <div style="padding:10px 14px 0;flex-shrink:0">
        <button onclick="exportPDF()" style="width:100%;padding:10px;background:var(--accent);border:none;border-radius:10px;color:#0e1628;font-family:'Courier New',Courier,monospace;font-size:12px;font-weight:700;cursor:pointer;">&#128196; Exporter en PDF</button>
      </div>
      <div class="gantt-scroll" id="ganttScroll">
        <div class="gantt-container" id="ganttContainer"></div>
      </div>
      <div class="gantt-legend">
        <div class="gantt-legend-item"><div class="gantt-legend-dot" style="background:rgba(245,166,35,0.85)"></div>T&acirc;che (ES&rarr;EF)</div>
        <div class="gantt-legend-item"><div class="gantt-legend-dot" style="background:rgba(224,92,122,0.9)"></div>Critique</div>
        <div class="gantt-legend-item"><div class="gantt-legend-dot" style="background:rgba(46,61,90,0.7);border:1px dashed #2e3d5a"></div>Marge</div>
      </div>
    </div>
  </div>
</div>

<!-- SETTINGS MODAL -->
<div class="modal-overlay" id="modalSettings">
  <div class="modal">
    <h2>&#9881; Param&egrave;tres du projet</h2>
    <div class="field">
      <label>Unit&eacute; de temps</label>
      <div style="display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;">
        <button class="btn" id="sBtnUnitMin"  onclick="setSettingsUnit('min')"  style="flex:1;">&#9203; Minutes</button>
        <button class="btn" id="sBtnUnitHour" onclick="setSettingsUnit('hour')" style="flex:1;">&#128336; Heures</button>
        <button class="btn" id="sBtnUnitDay"  onclick="setSettingsUnit('day')"  style="flex:1;">&#128197; Jours</button>
      </div>
      <div id="sUnitDesc" style="font-size:10px;color:var(--muted);margin-top:6px;"></div>
    </div>
    <div class="field" id="sCalField">
      <label>Calendrier</label>
      <div style="display:flex;gap:8px;margin-top:4px;">
        <button class="btn" id="sBtnCalAll"  onclick="setSettingsCal('all')"  style="flex:1;">&#128198; Tous les jours</button>
        <button class="btn" id="sBtnCalWork" onclick="setSettingsCal('work')" style="flex:1;">&#128188; Jours ouvr&eacute;s</button>
      </div>
      <div id="sCalDesc" style="font-size:10px;color:var(--muted);margin-top:6px;"></div>
    </div>
    <div class="field">
      <label>Mode de planification</label>
      <div style="display:flex;gap:8px;margin-top:4px;">
        <button class="btn" id="sBtnModeStart" onclick="setSettingsMode('start')" style="flex:1;">&#128197; Date de d&eacute;but</button>
        <button class="btn" id="sBtnModeEnd"   onclick="setSettingsMode('end')"   style="flex:1;">&#127937; Date de fin</button>
      </div>
    </div>
    <div class="field" id="sAnchorField">
      <label id="sLabelDate">DATE DE D&Eacute;BUT</label>
      <input type="time" id="sTime" style="display:none;"/>
      <input type="date" id="sDate"/>
    </div>
    <div id="sDateResult" style="background:rgba(245,166,35,0.08);border:1px solid rgba(245,166,35,0.25);border-radius:10px;padding:10px 12px;font-size:11px;color:var(--text);line-height:1.8;margin-bottom:4px;display:none;"></div>
    <div class="modal-actions">
      <button class="btn" id="btnSettingsCancel">Annuler</button>
      <button class="btn primary" id="btnSettingsSave">Appliquer</button>

</div>

<div class="modal-overlay" id="modalTask">

    <div class="field"><label>NOM</label><input type="text" id="fName" placeholder="ex: Conception"></div>
    <div class="field"><label id="fDurLabel">DUR&Eacute;E (jours)</label><input type="number" id="fDur" placeholder="5" min="0" step="1"></div>
    <div class="field"><label>PR&Eacute;D&Eacute;CESSEURS</label><div class="multi-check" id="fPreds"></div></div>
    <div class="modal-actions">
      <button class="btn" id="btnTaskCancel">Annuler</button>
      <button class="btn primary" id="btnTaskSave">Enregistrer</button>

</div>

<!-- PROJECT MODAL -->
<div class="modal-overlay" id="modalProj">
  <div class="modal">
    <h2>Nouveau projet</h2>
    <div class="field"><label>NOM DU PROJET</label><input type="text" id="fProjName" placeholder="ex: Anniversaire surprise"></div>
    <div class="field"><label>DESCRIPTION (optionnel)</label><input type="text" id="fProjDesc" placeholder="ex: F&ecirc;te du 13 juin"></div>

      <label>Mode de planification</label>
      <div style="display:flex;gap:8px;margin-top:4px;">
        <button class="btn" id="btnModeStart" onclick="setProjMode('start')" style="flex:1;border-color:var(--accent);color:var(--accent);">&#128197; Date de d&eacute;but</button>
        <button class="btn" id="btnModeEnd"   onclick="setProjMode('end')"   style="flex:1;">&#127937; Date de fin</button>
      </div>
    </div>
    <div class="field" id="fieldProjDate">
      <label id="labelProjDate">DATE DE D&Eacute;BUT</label>
      <input type="date" id="fProjDate"/>
    </div>
    <div class="modal-actions">
      <button class="btn" id="btnProjCancel">Annuler</button>
      <button class="btn primary" id="btnProjSave">Cr&eacute;er</button>

  </div>
</div>

<!-- DETAIL MODAL -->
<div class="modal-overlay" id="modalDetail">
  <div class="modal">
    <div id="detailContent"></div>
    <div class="modal-actions">
      <button class="btn" id="btnDetailClose">Fermer</button>
      <button class="btn primary" id="btnDetailEdit">&#9998; Modifier</button>
    </div>

<script>
var MAX_PROJ=5, NODE_W=120, NODE_H=76;
var COLORS=['#f5a623','#5bc4f5','#27ae60','#e05c7a','#9b8fd4'];
var STORAGE_K='pert_v2';

function loadData(){try{return JSON.parse(localStorage.getItem(STORAGE_K))||{projects:[]};}catch(e){return{projects:[]};}}
function saveData(){localStorage.setItem(STORAGE_K,JSON.stringify(appData));}

var appData=loadData();
var currentProjId=null, tasks=[];

function currentProj(){return appData.projects.filter(function(p){return p.id===currentProjId;})[0];}
function saveTasks(){var p=currentProj();if(p){p.tasks=tasks;p.updatedAt=Date.now();saveData();}}

// ── UNIT HELPERS ──
function unitPrefix(proj){var u=(proj&&proj.unit)?proj.unit:'day';if(u==='min')return 'M';if(u==='hour')return 'H';return 'J';}
function unitSuffix(proj){var u=(proj&&proj.unit)?proj.unit:'day';if(u==='min')return 'min';if(u==='hour')return 'h';return 'j';}
function unitFull(proj){var u=(proj&&proj.unit)?proj.unit:'day';if(u==='min')return 'minutes';if(u==='hour')return 'heures';return 'jours';}

// ── PERT CALC ──
function calcPertOn(arr){
  arr.forEach(function(t){t.es=0;t.ef=0;t.ls=Infinity;t.lf=Infinity;t.slack=0;});
  var changed=true,iter=0;
  while(changed&&iter++<100){changed=false;arr.forEach(function(t){var es=0;(t.preds||[]).forEach(function(pid){var p=arr.filter(function(x){return x.id===pid;})[0];if(p)es=Math.max(es,p.ef);});var ef=es+(parseFloat(t.dur)||0);if(es!==t.es||ef!==t.ef){t.es=es;t.ef=ef;changed=true;}});}
  var maxEF=arr.length?Math.max.apply(null,arr.map(function(t){return t.ef;})):0;
  arr.forEach(function(t){t.lf=maxEF;t.ls=maxEF-(parseFloat(t.dur)||0);});
  changed=true;iter=0;
  while(changed&&iter++<100){changed=false;arr.forEach(function(t){arr.forEach(function(s){if((s.preds||[]).indexOf(t.id)>=0&&s.ls<t.lf){t.lf=s.ls;t.ls=t.lf-(parseFloat(t.dur)||0);changed=true;}});});}
  arr.forEach(function(t){t.slack=parseFloat((t.lf-t.ef).toFixed(2));t.critical=(t.slack===0);});
  return{maxEF:maxEF,critTasks:arr.filter(function(t){return t.critical;}).sort(function(a,b){return a.es-b.es;})};
}
function calcPert(){return calcPertOn(tasks);}

// ── LAYOUT ──
var layoutData={};
function autoLayout(){
  if(!tasks.length)return;
  var res=calcPert(),critSet={};
  res.critTasks.forEach(function(t){critSet[t.id]=true;});
  var col={};tasks.forEach(function(t){col[t.id]=0;});
  var changed=true,iter=0;
  while(changed&&iter++<100){changed=false;tasks.forEach(function(t){(t.preds||[]).forEach(function(pid){if((col[pid]||0)+1>col[t.id]){col[t.id]=(col[pid]||0)+1;changed=true;}});});}
  var cols={};tasks.forEach(function(t){var c=col[t.id];if(!cols[c])cols[c]=[];cols[c].push(t);});
  var colKeys=Object.keys(cols).map(Number).sort(function(a,b){return a-b;});
  var numCols=colKeys.length+1;
  var wrap=document.getElementById('canvas-wrap');
  var canvasW=wrap.clientWidth||390,canvasH=wrap.clientHeight||500;
  var PAD_X=10,PAD_Y=10,MIN_GAP_X=8,MIN_GAP_Y=8;
  var maxAbove=0,maxBelow=0;
  colKeys.forEach(function(c){var nc=cols[c].filter(function(t){return !critSet[t.id];});maxAbove=Math.max(maxAbove,Math.ceil(nc.length/2));maxBelow=Math.max(maxBelow,Math.floor(nc.length/2));});
  var totalRows=1+maxAbove+maxBelow;
  var nw=Math.min(NODE_W,Math.max(60,(canvasW-2*PAD_X-(numCols-1)*MIN_GAP_X)/numCols));
  var nh=Math.min(NODE_H,Math.max(50,(canvasH-2*PAD_Y-(totalRows-1)*MIN_GAP_Y)/Math.max(totalRows,1)));
  var colGap=numCols>1?Math.max(MIN_GAP_X,(canvasW-2*PAD_X-numCols*nw)/(numCols-1)):0;
  var rowStep=nh+Math.max(MIN_GAP_Y,(canvasH-2*PAD_Y-totalRows*nh)/Math.max(totalRows-1,1));
  var colX={};colKeys.forEach(function(c,i){colX[c]=PAD_X+i*(nw+colGap);});
  var finColX=PAD_X+(numCols-1)*(nw+colGap),midY=PAD_Y+maxAbove*rowStep;
  colKeys.forEach(function(c){
    var crits=cols[c].filter(function(t){return critSet[t.id];});
    var noncrits=cols[c].filter(function(t){return !critSet[t.id];});
    crits.forEach(function(t,i){t.x=colX[c]+i*(nw+4);t.y=midY;t._nw=nw;t._nh=nh;});
    noncrits.forEach(function(t,i){var above=(i%2===0),band=Math.floor(i/2)+1;t.x=colX[c];t.y=above?midY-band*rowStep:midY+band*rowStep;t._nw=nw;t._nh=nh;});
  });
  layoutData={nw:nw,nh:nh,finX:finColX,finY:midY};
}

// ── GRAPH ──
var scale=1,offsetX=0,offsetY=0,connectMode=false,connectSource=null;

function arrow(svg,x1,y1,x2,y2,isCrit){
  var cx=Math.max(20,(x2-x1)*0.4),el=document.createElementNS('http://www.w3.org/2000/svg','path');
  el.setAttribute('class','arrow'+(isCrit?' critical':''));
  el.setAttribute('d','M'+x1+','+y1+' C'+(x1+cx)+','+y1+' '+(x2-cx)+','+y2+' '+x2+','+y2);
  el.setAttribute('marker-end',isCrit?'url(#ahc)':'url(#ah)');
  svg.appendChild(el);
}
function applyTransform(){
  var t='translate('+offsetX+'px,'+offsetY+'px) scale('+scale+')';
  document.getElementById('canvas').style.cssText+='transform:'+t+';transform-origin:0 0';
  document.getElementById('arrows').style.cssText+='transform:'+t+';transform-origin:0 0';
}

function renderGraph(){
  var res=calcPert(),canvas=document.getElementById('canvas'),svg=document.getElementById('arrows');
  canvas.innerHTML='';svg.querySelectorAll('.arrow').forEach(function(e){e.remove();});
  applyTransform();
  var p=currentProj(),PRE=unitPrefix(p),SUF=unitSuffix(p);
  document.getElementById('infoDurUnit').textContent=SUF;
  if(!tasks.length){document.getElementById('infoCount').textContent='0';document.getElementById('infoDuration').textContent='0';document.getElementById('infoCritical').textContent='—';return;}
  var nw=layoutData.nw||NODE_W,nh=layoutData.nh||NODE_H,finX=layoutData.finX||300,finY=layoutData.finY||100;
  var successorIds={};tasks.forEach(function(t){(t.preds||[]).forEach(function(pid){successorIds[pid]=true;});});
  var terminals=tasks.filter(function(t){return !successorIds[t.id];});
  var finIsCrit=terminals.some(function(t){return t.critical;});
  tasks.forEach(function(t){(t.preds||[]).forEach(function(pid){var pp=tasks.filter(function(x){return x.id===pid;})[0];if(!pp)return;var ic=t.critical&&pp.critical;arrow(svg,(pp.x||0)+(pp._nw||nw),(pp.y||0)+(pp._nh||nh)/2,(t.x||0),(t.y||0)+(t._nh||nh)/2,ic);});});
  terminals.forEach(function(pp){var ic=pp.critical&&finIsCrit;arrow(svg,(pp.x||0)+(pp._nw||nw),(pp.y||0)+(pp._nh||nh)/2,finX,finY+nh/2,ic);});
  tasks.forEach(function(t){
    var tnw=t._nw||nw,tnh=t._nh||nh;
    var fId=Math.max(7,Math.min(9,tnw*0.075)),fName=Math.max(8,Math.min(12,tnw*0.1)),fData=Math.max(7,Math.min(10,tnw*0.083));
    var el=document.createElement('div');
    el.className='node'+(t.critical?' critical':'');el.dataset.id=t.id;
    el.style.left=(t.x||0)+'px';el.style.top=(t.y||0)+'px';el.style.width=tnw+'px';el.style.height=tnh+'px';
    var sc=t.slack===0?'zero':'';
    el.innerHTML='<div class="node-inner"><div class="node-id" style="font-size:'+fId+'px">'+t.id+'</div><div class="node-name" style="font-size:'+fName+'px">'+t.name+'</div><div class="node-times" style="font-size:'+fData+'px"><span class="node-es">ES:'+t.es+'</span> <span class="node-dur">D:'+t.dur+'</span> <span class="node-ls">LS:'+(t.ls===Infinity?'?':t.ls)+'</span></div><div class="node-slack '+sc+'" style="font-size:'+fData+'px">marge:'+(t.slack===Infinity?'?':t.slack)+SUF+'</div></div>';
    canvas.appendChild(el);addNodeInteraction(el,t);
  });
  var fFin=Math.max(10,Math.min(15,nw*0.12)),finEl=document.createElement('div');
  finEl.className='node fin-node'+(finIsCrit?' critical':'');
  finEl.style.cssText='left:'+finX+'px;top:'+finY+'px;width:'+nw+'px;height:'+nh+'px;align-items:center;justify-content:center;';
  finEl.innerHTML='<div style="text-align:center"><div style="font-family:Syne,sans-serif;font-size:'+fFin+'px;font-weight:800;color:'+(finIsCrit?'var(--critical)':'var(--accent)')+'">FIN</div><div style="font-size:'+(fFin*0.8)+'px;color:var(--accent);margin-top:2px">'+PRE+res.maxEF+'</div></div>';
  canvas.appendChild(finEl);
  document.getElementById('infoCount').textContent=tasks.length;
  document.getElementById('infoDuration').textContent=res.maxEF;
  document.getElementById('infoCritical').textContent=res.critTasks.length?res.critTasks.map(function(t){return t.name;}).join(' > '):'—';
}

function addNodeInteraction(el,task){
  el.addEventListener('click',function(){
    if(connectMode){if(!connectSource){connectSource=task.id;el.style.outline='2px solid var(--accent)';}else if(connectSource!==task.id){if(!task.preds)task.preds=[];if(task.preds.indexOf(connectSource)<0)task.preds.push(connectSource);saveTasks();renderGraph();connectSource=null;document.querySelectorAll('.node').forEach(function(n){n.style.outline='';});}return;}
    openDetailTask(task.id);
  });
  var startTX,startTY,startX,startY,isDragging=false;
  el.addEventListener('touchstart',function(e){var t=e.touches[0];startTX=t.clientX;startTY=t.clientY;startX=task.x||0;startY=task.y||0;isDragging=false;},{passive:true});
  el.addEventListener('touchmove',function(e){e.stopPropagation();var t=e.touches[0];var dx=(t.clientX-startTX)/scale,dy=(t.clientY-startTY)/scale;if(!isDragging&&Math.abs(dx)+Math.abs(dy)>5)isDragging=true;if(isDragging){task.x=Math.max(0,startX+dx);task.y=Math.max(0,startY+dy);el.style.left=task.x+'px';el.style.top=task.y+'px';renderArrows();}},{passive:true});
  el.addEventListener('touchend',function(){if(isDragging){saveTasks();renderGraph();}});
}

function renderArrows(){
  var svg=document.getElementById('arrows');svg.querySelectorAll('.arrow').forEach(function(e){e.remove();});
  var nw=layoutData.nw||NODE_W,nh=layoutData.nh||NODE_H,finX=layoutData.finX||300,finY=layoutData.finY||100;
  var successorIds={};tasks.forEach(function(t){(t.preds||[]).forEach(function(pid){successorIds[pid]=true;});});
  var terminals=tasks.filter(function(t){return !successorIds[t.id];});
  var finIsCrit=terminals.some(function(t){return t.critical;});
  tasks.forEach(function(t){(t.preds||[]).forEach(function(pid){var pp=tasks.filter(function(x){return x.id===pid;})[0];if(!pp)return;var pnw=pp._nw||nw,pnh=pp._nh||nh,tnh=t._nh||nh;arrow(svg,(pp.x||0)+pnw,(pp.y||0)+pnh/2,(t.x||0),(t.y||0)+tnh/2,t.critical&&pp.critical);});});
  terminals.forEach(function(pp){arrow(svg,(pp.x||0)+(pp._nw||nw),(pp.y||0)+(pp._nh||nh)/2,finX,finY+nh/2,pp.critical&&finIsCrit);});
}

// ── DETAIL TASK ──
var detailTaskId=null;
function openDetailTask(id){
  var t=tasks.filter(function(x){return x.id===id;})[0];if(!t)return;
  detailTaskId=id;calcPert();
  var p=currentProj(),PRE=unitPrefix(p),SUF=unitSuffix(p),FUL=unitFull(p);
  var isCrit=t.critical,slack=t.slack===Infinity?'?':t.slack,ls=t.ls===Infinity?'?':t.ls,lf=t.lf===Infinity?'?':t.lf;
  var predNames=(t.preds||[]).map(function(pid){var pp=tasks.filter(function(x){return x.id===pid;})[0];return pp?'<span class="pred-tag">'+pp.id+' '+pp.name+'</span>':'';}).join('');
  var succNames=tasks.filter(function(s){return(s.preds||[]).indexOf(t.id)>=0;}).map(function(s){return'<span class="pred-tag">'+s.id+' '+s.name+'</span>';}).join('');
  function fmtVal(raw,num){return raw?fmtFR(raw):PRE+num;}
  var explain='';
  if(!(t.preds||[]).length){explain='Cette t&acirc;che n\'a pas d\'ant&eacute;c&eacute;dent : elle peut d&eacute;marrer d&egrave;s <b>'+PRE+'0</b>.';}
  else{var predList=(t.preds||[]).map(function(pid){var pp=tasks.filter(function(x){return x.id===pid;})[0];return pp?'<b>'+pp.name+'</b> (finit &agrave; '+fmtVal(pp.dateEF,pp.ef)+')':'';}).join(', ');explain='Elle attend la fin de '+predList+'. Elle peut d&eacute;marrer au plus t&ocirc;t &agrave; <b>'+fmtVal(t.dateES,t.es)+'</b> et se terminer &agrave; <b>'+fmtVal(t.dateEF,t.ef)+'</b> (ES+'+t.dur+SUF+').';}
  if(isCrit)explain+=' <b>Marge z&eacute;ro&nbsp;:</b> tout retard retarde la fin du projet.';
  else explain+=' Elle dispose de <b>'+slack+SUF+' de marge</b>.';
  var badge=isCrit?'<div class="detail-critical-badge">&#9888; Chemin critique &mdash; marge 0</div>':'<div class="detail-ok-badge">&#10003; Hors chemin critique</div>';
  document.getElementById('detailContent').innerHTML=
    '<div class="detail-id">'+t.id+'</div><div class="detail-title">'+t.name+'</div>'+badge
    +'<div class="detail-grid">'
      +'<div class="detail-cell ok"><div class="detail-label">ES &mdash; D&eacute;but au plus t&ocirc;t</div><div class="detail-value green">'+fmtVal(t.dateES,t.es)+'</div><div class="detail-sub">1er '+FUL.replace(/s$/,'')+' possible</div></div>'
      +'<div class="detail-cell ok"><div class="detail-label">EF &mdash; Fin au plus t&ocirc;t</div><div class="detail-value green">'+fmtVal(t.dateEF,t.ef)+'</div><div class="detail-sub">ES + '+t.dur+SUF+'</div></div>'
      +'<div class="detail-cell'+(isCrit?' critical':'')+'"><div class="detail-label">LS &mdash; D&eacute;but au plus tard</div><div class="detail-value'+(isCrit?' red':' accent3')+'">'+fmtVal(t.dateLS,ls)+'</div><div class="detail-sub">Sans retarder le projet</div></div>'
      +'<div class="detail-cell'+(isCrit?' critical':'')+'"><div class="detail-label">LF &mdash; Fin au plus tard</div><div class="detail-value'+(isCrit?' red':' accent3')+'">'+fmtVal(t.dateLF,lf)+'</div><div class="detail-sub">LS + '+t.dur+SUF+'</div></div>'
      +'<div class="detail-cell" style="grid-column:1/2"><div class="detail-label">Dur&eacute;e</div><div class="detail-value accent">'+t.dur+SUF+'</div><div class="detail-sub">EF &minus; ES</div></div>'
      +'<div class="detail-cell'+(isCrit?' critical':'')+'" style="grid-column:2/3"><div class="detail-label">Marge libre</div><div class="detail-value'+(isCrit?' red':' green')+'">'+slack+SUF+'</div><div class="detail-sub">LF &minus; EF</div></div>'
    +'</div>'
    +'<div class="detail-explain">'+explain+'</div>'
    +(predNames?'<div class="detail-preds"><div class="detail-preds-label">Ant&eacute;c&eacute;dents</div>'+predNames+'</div>':'')
    +(succNames?'<div class="detail-preds" style="margin-top:8px"><div class="detail-preds-label">Successeurs</div>'+succNames+'</div>':'');
  document.getElementById('modalDetail').classList.add('open');
}

// ── TASK LIST ──
function renderTaskList(){
  calcPert();var p=currentProj(),PRE=unitPrefix(p),SUF=unitSuffix(p);
  var list=document.getElementById('taskList');
  if(!tasks.length){list.innerHTML='<div class="empty-state"><div class="icon">&#128203;</div>Aucune t&acirc;che.<br>Appuyez sur + pour commencer.</div>';return;}
  list.innerHTML=tasks.map(function(t){
    var pnames=(t.preds||[]).map(function(pid){var pp=tasks.filter(function(x){return x.id===pid;})[0];return pp?pp.id:'?';}).join(', ');
    return '<div class="task-item'+(t.critical?' critical':'')+'"><div class="task-info"><div class="task-name">'+t.id+' &mdash; '+t.name+'</div>'
      +(t.dateES?'<div class="task-meta" style="color:var(--accent)">&#128197; '+fmtFR(t.dateES)+' &rarr; '+fmtFR(t.dateEF)+'</div><div class="task-meta">&#8987; Au + tard: '+fmtFR(t.dateLS)+' &rarr; '+fmtFR(t.dateLF)+' &middot; marge:'+(t.slack===Infinity?'?':t.slack)+SUF+(pnames?' &middot; &larr;'+pnames:'')+'</div>'
        :'<div class="task-meta">'+t.dur+SUF+' &middot; ES:'+PRE+t.es+' EF:'+PRE+t.ef+' &middot; LS:'+PRE+(t.ls===Infinity?'?':t.ls)+' &middot; marge:'+(t.slack===Infinity?'?':t.slack)+SUF+(pnames?' &middot; &larr;'+pnames:'')+'</div>')
      +'</div><div class="task-actions"><button class="icon-btn" onclick="openEditTask(\''+t.id+'\')">&#9998;</button><button class="icon-btn" onclick="deleteTask(\''+t.id+'\')">&#128465;</button></div></div>';
  }).join('');
}

// ── STATS ──
function renderStats(){
  var content=document.getElementById('statsContent');
  if(!tasks.length){content.innerHTML='<div class="empty-state"><div class="icon">&#128202;</div>Ajoutez des t&acirc;ches<br>pour voir l\'analyse.</div>';return;}
  var res=calcPert(),p=currentProj(),PRE=unitPrefix(p),SUF=unitSuffix(p),FULL=unitFull(p);
  var noCrit=tasks.filter(function(t){return !t.critical;});
  var avgSlack=noCrit.length?(noCrit.reduce(function(s,t){return s+(t.slack||0);},0)/noCrit.length).toFixed(1):'&mdash;';
  var critPath=res.critTasks.map(function(t,i){return'<span class="cp-node">'+t.id+': '+t.name+'</span>'+(i<res.critTasks.length-1?'<span class="cp-arrow">&#8594;</span>':'');}).join('');
  var taskRows=[].concat(tasks).sort(function(a,b){return a.es-b.es;}).map(function(t){return'<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:11px"><span style="color:'+(t.critical?'var(--critical)':'var(--text)')+'">'+t.id+' '+t.name+'</span><span style="color:var(--muted);flex-shrink:0;margin-left:8px">'+PRE+t.es+'&#8594;'+PRE+t.ef+' ('+t.dur+SUF+')</span></div>';}).join('');
  content.innerHTML='<div class="stat-card"><h3>Dur&eacute;e du projet</h3><div class="stat-big">'+res.maxEF+'</div><div class="stat-sub">'+FULL+' au total</div></div>'
    +'<div class="stat-card"><h3>Chemin critique</h3><div class="critical-path">'+critPath+'</div><div class="stat-sub" style="margin-top:10px">Dur&eacute;e: '+res.critTasks.reduce(function(s,t){return s+(parseFloat(t.dur)||0);},0)+' '+SUF+'</div></div>'

// ── GANTT ──
function renderGantt(){
  var container=document.getElementById('ganttContainer');
  if(!tasks.length){container.innerHTML='<div class="empty-state" style="padding:40px;width:100%"><div class="icon">&#128200;</div>Ajoutez des t&acirc;ches pour voir le Gantt.</div>';return;}
  var res=calcPert(),p=currentProj(),PRE=unitPrefix(p),SUF=unitSuffix(p);
  var pUnit=(p&&p.unit)?p.unit:'day',isTime=(pUnit==='min'||pUnit==='hour'),maxEF=res.maxEF;
  var scrollW=document.getElementById('ganttScroll').clientWidth||280;
  var colW=Math.max(22,Math.min(54,Math.floor((scrollW-110)/(maxEF+1))));
  var sorted=tasks.slice().sort(function(a,b){return a.es!==b.es?a.es-b.es:a.name.localeCompare(b.name);});

  function colLabel(i){
    if(!isTime&&p&&p._realStart){try{var calOld=calMode;calMode=p.calMode||'all';var anc=parseDate(p._realStart);var d=pertDayToDate(anc,i);calMode=calOld;var step=colW<30?Math.ceil(maxEF/8):colW<40?2:1;if(i%step!==0)return'';return(d.getDate()<10?'0':'')+d.getDate()+'/'+(d.getMonth()<10?'0':'')+(d.getMonth()+1);}catch(e){return PRE+i;}}
    if(isTime&&p&&p._realStart){var toMins=pUnit==='min'?1:60;var startM=timeToMinutes(p._realStart);var step2=colW<30?Math.ceil(maxEF/8):colW<40?2:1;if(i%step2!==0)return'';return minutesToHHMM(startM+i*toMins);}
    var step3=colW<30?Math.ceil(maxEF/8):colW<40?2:1;if(i%step3!==0)return'';return PRE+i;
  }
  function isWE(i){if(isTime||!p||!p._realStart)return false;try{var anc=parseDate(p._realStart);var d=pertDayToDate(anc,i);var w=d.getDay();return w===0||w===6;}catch(e){return false;}}

  var labelsHtml='<div class="gantt-label-header">T&acirc;ches</div>';
  var headerHtml='<div class="gantt-header-row">';
  for(var c=0;c<=maxEF;c++){headerHtml+='<div class="gantt-col-head" style="width:'+colW+'px;min-width:'+colW+'px">'+colLabel(c)+'</div>';}
  headerHtml+='</div>';
  var rowsHtml='';
  sorted.forEach(function(t){
    var isCrit=t.critical,dotColor=isCrit?'var(--critical)':'var(--accent)';
    labelsHtml+='<div class="gantt-label-row" onclick="openDetailTask(\''+t.id+'\')"><div style="width:8px;height:8px;border-radius:50%;background:'+dotColor+';flex-shrink:0"></div><span class="gantt-label-text'+(isCrit?' critical':'')+'">'+t.name+'</span></div>';
    rowsHtml+='<div class="gantt-row">';
    for(var c2=0;c2<=maxEF;c2++){rowsHtml+='<div class="gantt-cell'+(isWE(c2)?' weekend':'')+'" style="width:'+colW+'px;min-width:'+colW+'px"></div>';}
    var bx=t.es*colW,bw=Math.max(colW*0.4,t.dur*colW);
    rowsHtml+='<div class="gantt-bar-wrap" style="left:'+(bx+110)+'px;width:'+bw+'px" onclick="openDetailTask(\''+t.id+'\')"><div class="gantt-bar es'+(isCrit?' critical':'')+'">'+t.name+'</div></div>';
    if(t.slack>0&&t.slack!==Infinity){var sx=t.ef*colW,sw=t.slack*colW;rowsHtml+='<div class="gantt-bar-wrap" style="left:'+(sx+110)+'px;width:'+sw+'px" onclick="openDetailTask(\''+t.id+'\')"><div class="gantt-bar slack">+'+t.slack+SUF+'</div></div>';}
    rowsHtml+='</div>';
  });
  container.innerHTML='<div class="gantt-labels">'+labelsHtml+'</div><div class="gantt-grid" style="width:'+((maxEF+1)*colW)+'px;min-width:'+((maxEF+1)*colW)+'px;position:relative">'+headerHtml+rowsHtml+'</div>';
}

// ── DATE HELPERS ──
function parseDate(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function formatDate(d){var y=d.getFullYear(),m=d.getMonth()+1,dd=d.getDate();return y+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd;}
function formatDateFR(d){var dd=d.getDate(),m=d.getMonth()+1,y=d.getFullYear();return(dd<10?'0':'')+dd+'/'+(m<10?'0':'')+m+'/'+y;}
function isWorkday(d){var w=d.getDay();return w>=1&&w<=5;}
var calMode='all';
function addWorkdays(d,n){if(calMode==='all'){var r=new Date(d);r.setDate(r.getDate()+n);return r;}var r=new Date(d),step=n>=0?1:-1,remaining=Math.abs(n);while(remaining>0){r.setDate(r.getDate()+step);if(isWorkday(r))remaining--;}return r;}
function pertDayToDate(anchor,pertDay){if(pertDay===0)return new Date(anchor);return addWorkdays(new Date(anchor),pertDay);}
function timeToMinutes(hhmm){var p=hhmm.split(':');return parseInt(p[0])*60+parseInt(p[1]);}
function minutesToHHMM(mins){var total=((Math.round(mins)%1440)+1440)%1440,h=Math.floor(total/60),m=total%60;return(h<10?'0':'')+h+':'+(m<10?'0':'')+m;}
function fmtFR(val){if(!val)return'';val=String(val).trim();if(val.length===5&&val.charAt(2)===':')return val;if(val.length===10&&val.charAt(4)==='-'&&val.charAt(7)==='-')return val.slice(8,10)+'/'+val.slice(5,7)+'/'+val.slice(0,4);return val;}

function computeCalendarDates(proj){
  var anchor=proj.dateAnchor?parseDate(proj.dateAnchor):null;
  if(!anchor||!proj.tasks||!proj.tasks.length)return;
  var oldCal=calMode;calMode=proj.calMode||'all';
  calcPertOn(proj.tasks);
  var maxEF=Math.max.apply(null,proj.tasks.map(function(t){return t.ef;}));
  if(proj.dateMode==='end'){
    var realStart=addWorkdays(new Date(anchor),-maxEF);
    proj.tasks.forEach(function(t){
      var dateES,dateEF,dateLS,dateLF;
      if(t.ef===maxEF){dateEF=new Date(anchor);dateES=addWorkdays(new Date(anchor),-(t.dur));}
      else{dateES=pertDayToDate(realStart,t.es);dateEF=pertDayToDate(realStart,t.ef);}
      var ls=t.ls===Infinity?t.es:t.ls,lf=t.lf===Infinity?t.ef:t.lf;
      if(lf===maxEF){dateLF=new Date(anchor);dateLS=addWorkdays(new Date(anchor),-(t.dur));}
      else{dateLS=pertDayToDate(realStart,ls);dateLF=pertDayToDate(realStart,lf);}
      t.dateES=formatDate(dateES);t.dateEF=formatDate(dateEF);t.dateLS=formatDate(dateLS);t.dateLF=formatDate(dateLF);
    });
    proj._realStart=formatDate(addWorkdays(new Date(anchor),-maxEF));proj._realEnd=formatDate(anchor);
  }else{
    proj.tasks.forEach(function(t){t.dateES=formatDate(pertDayToDate(anchor,t.es));t.dateEF=formatDate(pertDayToDate(anchor,t.ef));t.dateLS=formatDate(pertDayToDate(anchor,t.ls===Infinity?t.es:t.ls));t.dateLF=formatDate(pertDayToDate(anchor,t.lf===Infinity?t.ef:t.lf));});
    proj._realStart=formatDate(anchor);proj._realEnd=formatDate(pertDayToDate(anchor,maxEF));
  }
  calMode=oldCal;
}
function computeTimeDates(proj){
  var anchor=proj.dateAnchor;if(!anchor||!proj.tasks||!proj.tasks.length)return;
  var unit=proj.unit||'day';calcPertOn(proj.tasks);
  var maxEF=Math.max.apply(null,proj.tasks.map(function(t){return t.ef;}));
  var anchorMins=timeToMinutes(anchor),toMins=unit==='min'?1:60;
  var startMins=proj.dateMode==='end'?anchorMins-maxEF*toMins:anchorMins;
  proj.tasks.forEach(function(t){var ls=t.ls===Infinity?t.es:t.ls,lf=t.lf===Infinity?t.ef:t.lf;t.dateES=minutesToHHMM(startMins+t.es*toMins);t.dateEF=minutesToHHMM(startMins+t.ef*toMins);t.dateLS=minutesToHHMM(startMins+ls*toMins);t.dateLF=minutesToHHMM(startMins+lf*toMins);});
  proj._realStart=minutesToHHMM(startMins);proj._realEnd=minutesToHHMM(startMins+maxEF*toMins);
}
