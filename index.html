<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0e1628">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PERT">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<title>PERT Planner</title>
<style>
/* Fonts loaded via link tag */

:root {
  --bg:       #0e1628;
  --surface:  #1a2540;
  --card:     #1e2d47;
  --border:   #2e3d5a;
  --accent:   #f5a623;
  --accent2:  #e05c7a;
  --accent3:  #5bc4f5;
  --text:     #e8eef5;
  --muted:    #6a7fa0;
  --critical: #e05c7a;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Mono', monospace;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.btn {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  padding: 7px 12px;
  border-radius: 7px;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s;
}
.btn:active { transform: scale(0.95); opacity: 0.8; }
.btn.primary { background: var(--accent); color: #0e1628; border-color: var(--accent); font-weight: 700; }
.btn.danger  { background: rgba(224,92,122,0.15); color: var(--accent2); border-color: var(--accent2); }
.btn.sm      { padding: 5px 9px; font-size: 10px; }

#projectScreen { display: flex; flex-direction: column; flex: 1; overflow: hidden; }

.proj-header {
  padding: 18px 16px 14px;
  border-bottom: 2px solid var(--accent);
  background: var(--bg);
  flex-shrink: 0;
}
.proj-header h1 {
  font-family: 'Syne', sans-serif;
  font-size: 22px; font-weight: 800;
  color: var(--accent); letter-spacing: -0.5px;
}
.proj-header p { font-size: 11px; color: var(--muted); margin-top: 3px; letter-spacing: .1em; text-transform: uppercase; }

.proj-list { flex: 1; overflow-y: auto; padding: 16px; -webkit-overflow-scrolling: touch; }

.proj-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 12px;
  cursor: pointer;
  transition: border-color 0.15s;
}
.proj-card:active { transform: scale(0.98); }
.proj-card:hover { border-color: var(--accent); }
.proj-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.proj-name { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; color: var(--text); }
.proj-meta { font-size: 10px; color: var(--muted); margin-top: 5px; }
.proj-badge {
  font-size: 9px; padding: 3px 8px; border-radius: 20px;
  background: rgba(245,166,35,0.12); color: var(--accent);
  border: 1px solid rgba(245,166,35,0.3); white-space: nowrap; flex-shrink: 0;
}
.proj-actions { display: flex; gap: 6px; margin-top: 12px; }
.color-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }

.proj-new-btn {
  width: 100%; padding: 16px;
  background: transparent;
  border: 1.5px dashed var(--border);
  border-radius: 14px;
  color: var(--muted);
  font-family: 'DM Mono', monospace;
  font-size: 12px; cursor: pointer;
  text-align: center; transition: all 0.15s;
}
.proj-new-btn:active { border-color: var(--accent); color: var(--accent); }
.proj-new-btn:hover  { border-color: var(--accent); color: var(--accent); }

#appScreen { display: none; flex-direction: column; flex: 1; overflow: hidden; }
#appScreen.visible { display: flex; }

header {
  display: flex; align-items: center;
  padding: 10px 12px;
  border-bottom: 2px solid var(--accent);
  background: var(--bg);
  flex-shrink: 0; gap: 8px;
}
.back-btn {
  background: none; border: 1px solid var(--border);
  color: var(--accent); font-size: 16px;
  width: 34px; height: 34px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
}
.header-title { flex: 1; min-width: 0; }
.header-title h1 {
  font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 800;
  color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.header-title p { font-size: 9px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
.header-actions { display: flex; gap: 4px; flex-shrink: 0; align-items: center; }
.btn-lbl { font-size: 9px; }
/* On very narrow screens hide labels */
@media (max-width: 360px) { .btn-lbl { display: none; } }

.tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--bg); flex-shrink: 0; }
.tab {
  flex: 1; padding: 10px 4px; text-align: center;
  font-size: 10px; color: var(--muted); cursor: pointer;
  border-bottom: 2px solid transparent; transition: all 0.15s;
  letter-spacing: .06em; text-transform: uppercase;
}
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.view { display: none; flex: 1; overflow: hidden; flex-direction: column; }
.view.active { display: flex; }

#canvas-wrap {
  flex: 1; overflow: hidden; position: relative;
  background:
    radial-gradient(circle at 15% 85%, rgba(245,166,35,0.06) 0%, transparent 50%),
    radial-gradient(circle at 85% 15%, rgba(91,196,245,0.04) 0%, transparent 50%),
    var(--bg);
}
#canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

.node {
  position: absolute;
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  user-select: none;
  touch-action: none;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: center;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.node.critical { border-color: var(--critical); box-shadow: 0 0 12px rgba(224,92,122,0.3); }
.node.fin-node { border-style: double; border-width: 3px; background: var(--surface); }

.node-inner { padding: 5px 7px; overflow: hidden; width: 100%; }
.node-id    { color: var(--muted); letter-spacing: 0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.node-name  { font-weight: 500; color: var(--text); line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.node-times { display: flex; gap: 2px; white-space: nowrap; overflow: hidden; }
.node-es    { color: var(--accent); }
.node-ls    { color: var(--accent2); }
.node-dur   { color: var(--accent3); }
.node-slack { color: var(--muted); white-space: nowrap; }
.node-slack.zero { color: var(--critical); }

svg#arrows {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none; overflow: visible;
}
.arrow          { fill: none; stroke: var(--border); stroke-width: 1.5; marker-end: url(#arrowhead); }
.arrow.critical { stroke: var(--critical); stroke-width: 2.5; opacity: 0.9; }

.canvas-controls {
  position: absolute; bottom: 50px; right: 12px;
  display: flex; flex-direction: column; gap: 6px; z-index: 10;
}
.canvas-controls .btn { width: 38px; height: 38px; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; border-radius: 50%; }

.info-bar {
  background: var(--surface); border-top: 1px solid var(--border);
  padding: 7px 14px; font-size: 10px; color: var(--muted);
  display: flex; justify-content: space-between; flex-shrink: 0;
  gap: 6px; overflow: hidden;
}
.info-bar span { color: var(--accent); }
.info-crit { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.connect-banner {
  display: none; background: rgba(245,166,35,0.12);
  border-bottom: 1px solid var(--accent); color: var(--accent);
  font-size: 11px; padding: 7px 14px;
  align-items: center; justify-content: center; gap: 8px; flex-shrink: 0;
}
.connect-banner.show { display: flex; }

.form-view { flex: 1; overflow-y: auto; padding: 16px; -webkit-overflow-scrolling: touch; }

.field { margin-bottom: 10px; }
.field label { display: block; font-size: 10px; color: var(--muted); margin-bottom: 4px; letter-spacing: 0.5px; text-transform: uppercase; }
.field input {
  width: 100%; background: var(--bg); border: 1px solid var(--border);
  border-radius: 7px; color: var(--text); font-family: 'DM Mono', monospace;
  font-size: 13px; padding: 9px 11px; outline: none; transition: border-color 0.15s;
}
.field input:focus { border-color: var(--accent); }

.multi-check { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.check-pill {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 20px; padding: 5px 10px; font-size: 11px; cursor: pointer; transition: all 0.15s;
}
.check-pill.selected { background: rgba(245,166,35,0.18); border-color: var(--accent); color: var(--accent); }

.task-item {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 12px; margin-bottom: 8px;
  display: flex; align-items: center; gap: 10px;
}
.task-item.critical { border-left: 3px solid var(--critical); }
.task-info { flex: 1; min-width: 0; }
.task-name { font-size: 12px; font-weight: 500; margin-bottom: 2px; }
.task-meta { font-size: 10px; color: var(--muted); }
.task-actions { display: flex; gap: 6px; flex-shrink: 0; }
.icon-btn {
  background: none; border: 1px solid var(--border); color: var(--muted);
  border-radius: 6px; width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer;
}
.icon-btn:hover { border-color: var(--accent); color: var(--accent); }

.stats-view { flex: 1; overflow-y: auto; padding: 16px; -webkit-overflow-scrolling: touch; }
.stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
.stat-card h3 { font-family: 'Syne', sans-serif; font-size: 11px; color: var(--muted); margin-bottom: 10px; letter-spacing: 1px; text-transform: uppercase; }
.stat-big { font-family: 'Syne', sans-serif; font-size: 36px; font-weight: 800; color: var(--accent); line-height: 1; }
.stat-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
.critical-path { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.cp-node { background: rgba(224,92,122,0.15); border: 1px solid var(--critical); border-radius: 6px; padding: 4px 9px; font-size: 11px; color: var(--critical); }
.cp-arrow { color: var(--muted); font-size: 14px; display: flex; align-items: center; }

/* ── GANTT ── */
.gantt-view { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
.gantt-scroll { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; position: relative; }
.gantt-container { display: flex; min-width: 100%; }

/* Left column: task names */
.gantt-labels {
  flex-shrink: 0;
  width: 110px;
  border-right: 1px solid var(--border);
  background: var(--bg);
  position: sticky; left: 0; z-index: 10;
}
.gantt-label-header {
  height: 36px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 8px;
  font-size: 9px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase;
  background: var(--surface);
}
.gantt-label-row {
  height: 36px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 8px; gap: 5px;
  cursor: pointer; transition: background 0.1s;
}
.gantt-label-row:hover { background: var(--card); }
.gantt-label-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.gantt-label-text { font-size: 11px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.gantt-label-text.critical { color: var(--critical); }

/* Right: grid + bars */
.gantt-grid { flex: 1; position: relative; }
.gantt-header-row {
  display: flex; height: 36px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  position: sticky; top: 0; z-index: 5;
}
.gantt-col-head {
  flex-shrink: 0; height: 36px;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; color: var(--muted);
  border-right: 1px solid var(--border);
}
.gantt-col-head.today { background: rgba(245,166,35,0.12); color: var(--accent); font-weight: 700; }

.gantt-row {
  display: flex; height: 36px;
  border-bottom: 1px solid var(--border);
  position: relative;
}
.gantt-cell {
  flex-shrink: 0; height: 36px;
  border-right: 1px solid rgba(46,61,90,0.5);
}
.gantt-cell.weekend { background: rgba(46,61,90,0.3); }
.gantt-cell.today-col { background: rgba(245,166,35,0.06); border-right: 1px solid rgba(245,166,35,0.3); }

/* Bars */
.gantt-bar-wrap { position: absolute; top: 6px; height: 24px; z-index: 3; }
.gantt-bar {
  height: 100%; border-radius: 5px;
  display: flex; align-items: center; padding: 0 6px;
  font-size: 9px; font-weight: 500; white-space: nowrap; overflow: hidden;
  box-sizing: border-box; cursor: pointer;
  transition: opacity 0.15s;
}
.gantt-bar:active { opacity: 0.8; }
.gantt-bar.es { background: rgba(245,166,35,0.85); color: #0e1628; }
.gantt-bar.es.critical { background: rgba(224,92,122,0.9); color: #fff; }
.gantt-bar.slack { background: rgba(46,61,90,0.7); color: var(--muted); border: 1px dashed var(--border); }

/* Today line */
.gantt-today-line {
  position: absolute; top: 0; bottom: 0; width: 2px;
  background: var(--accent); opacity: 0.7; z-index: 4; pointer-events: none;
}

/* Legend */
.gantt-legend {
  display: flex; gap: 12px; padding: 7px 14px;
  border-top: 1px solid var(--border);
  background: var(--surface); flex-shrink: 0;
  font-size: 10px; color: var(--muted); flex-wrap: wrap;
}
.gantt-legend-item { display: flex; align-items: center; gap: 5px; }
.gantt-legend-dot { width: 12px; height: 10px; border-radius: 3px; flex-shrink: 0; }

.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.75); z-index: 200; align-items: flex-end;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface); border: 1px solid var(--accent);
  border-radius: 16px 16px 0 0; padding: 20px 16px 32px;
  width: 100%; max-height: 85dvh; overflow-y: auto;
}
.modal h2 { font-family: 'Syne', sans-serif; font-size: 16px; color: var(--accent); margin-bottom: 16px; }
.modal-actions { display: flex; gap: 8px; margin-top: 16px; }
.modal-actions .btn { flex: 1; padding: 12px; font-size: 13px; text-align: center; }

.empty-state { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 13px; line-height: 1.8; }
.empty-state .icon { font-size: 40px; margin-bottom: 12px; }

.detail-title { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800; color: var(--accent); margin-bottom: 4px; }
.detail-id { font-size: 10px; color: var(--muted); letter-spacing: 1px; margin-bottom: 16px; text-transform: uppercase; }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.detail-cell { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.detail-cell.critical { border-color: var(--critical); background: rgba(224,92,122,0.08); }
.detail-cell.ok       { border-color: #27ae60; background: rgba(39,174,96,0.08); }
.detail-label { font-size: 9px; color: var(--muted); letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 4px; }
.detail-value { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800; color: var(--text); line-height: 1; }
.detail-value.accent  { color: var(--accent); }
.detail-value.accent3 { color: var(--accent3); }
.detail-value.red     { color: var(--critical); }
.detail-value.green   { color: #27ae60; }
.detail-sub { font-size: 10px; color: var(--muted); margin-top: 3px; }
.detail-explain {
  background: rgba(245,166,35,0.08); border: 1px solid rgba(245,166,35,0.25);
  border-radius: 10px; padding: 12px; font-size: 11px; color: var(--text);
  line-height: 1.7; margin-bottom: 12px;
}
.detail-explain b { color: var(--accent); }
.detail-preds { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 4px; }
.detail-preds-label { font-size: 9px; color: var(--muted); letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 6px; }
.pred-tag { display: inline-block; background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; font-size: 11px; margin: 2px 3px 2px 0; }
.detail-critical-badge { display: inline-block; background: rgba(224,92,122,0.15); border: 1px solid var(--critical); border-radius: 20px; padding: 4px 12px; font-size: 11px; color: var(--critical); font-weight: 500; margin-bottom: 14px; }
.detail-ok-badge { display: inline-block; background: rgba(39,174,96,0.12); border: 1px solid #27ae60; border-radius: 20px; padding: 4px 12px; font-size: 11px; color: #27ae60; font-weight: 500; margin-bottom: 14px; }
</style>
</head>
<body>

<!-- PROJECT SCREEN -->
<div id="projectScreen">
  <div class="proj-header">
    <h1>&#9672; PERT Planner</h1>
    <p>Vos projets &mdash; donn&eacute;es conserv&eacute;es localement</p>
  </div>
  <div class="proj-list" id="projList"></div>
</div>

<!-- APP SCREEN -->
<div id="appScreen">
  <header>
    <button class="back-btn" id="btnBack">&#8592;</button>
    <div class="header-title">
      <h1 id="headerProjName">Projet</h1>
      <p id="headerProjSub"></p>
    </div>
    <div class="header-actions">
      <button class="btn sm" id="btnSettings" title="Param&egrave;tres">&#9881; <span class="btn-lbl">R&eacute;glag.</span></button>
      <button class="btn sm" id="btnLayout" title="R&eacute;organiser">&#8859; <span class="btn-lbl">Auto</span></button>
      <button class="btn sm" id="btnConnect" title="Mode liaison">&#8674; <span class="btn-lbl">Lier</span></button>
      <button class="btn sm" id="btnPDF" title="Exporter PDF">&#128196; <span class="btn-lbl">PDF</span></button>
      <button class="btn sm primary" id="btnAdd">&#65291;</button>
    </div>
  </header>

  <div class="tabs">
    <div class="tab active" data-view="graph">Graphe</div>
    <div class="tab" data-view="tasks">T&acirc;ches</div>
    <div class="tab" data-view="stats">Analyse</div>
    <div class="tab" data-view="gantt">Gantt</div>
  </div>

  <div class="connect-banner" id="connectBanner">
    Touchez source puis cible
    <button class="btn sm" id="btnCancelConnect">&#10005;</button>
  </div>

  <div class="view active" id="view-graph">
    <div id="canvas-wrap">
      <svg id="arrows">
        <defs>
          <marker id="ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0,8 3,0 6" fill="#2e3d5a"/>
          </marker>
          <marker id="ahc" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0,8 3,0 6" fill="#e05c7a"/>
          </marker>
        </defs>
      </svg>
      <div id="canvas"></div>
      <div class="canvas-controls">
        <button class="btn" id="btnZoomIn">+</button>
        <button class="btn" id="btnZoomOut">-</button>
        <button class="btn" id="btnFit">&#8861;</button>
      </div>
    </div>
    <div class="info-bar">
      <div>T: <span id="infoCount">0</span></div>
      <div>Dur&eacute;e: <span id="infoDuration">0</span><span id="infoDurUnit">j</span></div>
      <div class="info-crit">Critique: <span id="infoCritical">&mdash;</span></div>
    </div>
  </div>

  <div class="view" id="view-tasks">
    <div style="padding:10px 14px 0;flex-shrink:0">
      <button onclick="exportPDF()" style="width:100%;padding:10px;background:var(--accent);border:none;border-radius:10px;color:#0e1628;font-family:'DM Mono',monospace;font-size:12px;font-weight:700;cursor:pointer;">&#128196; Exporter en PDF &amp; envoyer par e-mail</button>
    </div>
    <div class="form-view" id="taskList"></div>
  </div>

  <div class="view" id="view-stats">
    <div style="padding:10px 14px 0;flex-shrink:0">
      <button onclick="exportPDF()" style="width:100%;padding:10px;background:var(--accent);border:none;border-radius:10px;color:#0e1628;font-family:'DM Mono',monospace;font-size:12px;font-weight:700;cursor:pointer;">&#128196; Exporter en PDF &amp; envoyer par e-mail</button>
    </div>
    <div class="stats-view" id="statsContent"></div>
  </div>

  <div class="view" id="view-gantt">
    <div class="gantt-view" id="ganttView">
      <div style="padding:10px 14px 0;flex-shrink:0">

<script>
var MAX_PROJ  = 5;
var NODE_W    = 120;
var NODE_H    = 76;
var COLORS    = ['#f5a623','#5bc4f5','#27ae60','#e05c7a','#9b8fd4'];
var STORAGE_K = 'pert_v2';

function loadData() {
  try { return JSON.parse(localStorage.getItem(STORAGE_K)) || {projects:[]}; }
  catch(e) { return {projects:[]}; }
}
function saveData() { localStorage.setItem(STORAGE_K, JSON.stringify(appData)); }

var appData = loadData();
var currentProjId = null;
var tasks = [];

function currentProj() {
  return appData.projects.filter(function(p){ return p.id === currentProjId; })[0];
}
function saveTasks() {
  var p = currentProj();
  if (p) { p.tasks = tasks; p.updatedAt = Date.now(); saveData(); }
}

// ── UNIT HELPERS ──
// Returns the prefix letter for ES/LS display: J (jours), H (heures), M (minutes)
function unitPrefix(proj) {
  var u = (proj && proj.unit) ? proj.unit : 'day';
  if (u === 'min')  return 'M';
  if (u === 'hour') return 'H';
  return 'J';
}
// Returns the suffix for durations: j, h, min
function unitSuffix(proj) {
  var u = (proj && proj.unit) ? proj.unit : 'day';
  if (u === 'min')  return 'min';
  if (u === 'hour') return 'h';
  return 'j';
}
// Returns the full label: jours, heures, minutes
function unitFull(proj) {
  var u = (proj && proj.unit) ? proj.unit : 'day';
  if (u === 'min')  return 'minutes';
  if (u === 'hour') return 'heures';
  return 'jours';
}

function calcPertOn(arr) {
  arr.forEach(function(t){ t.es=0; t.ef=0; t.ls=Infinity; t.lf=Infinity; t.slack=0; });
  var changed=true, iter=0;
  while (changed && iter++<100) {
    changed=false;
    arr.forEach(function(t){
      var es=0;
      (t.preds||[]).forEach(function(pid){
        var p=arr.filter(function(x){return x.id===pid;})[0];
        if (p) es=Math.max(es,p.ef);
      });
      var ef=es+(parseFloat(t.dur)||0);
      if (es!==t.es||ef!==t.ef){ t.es=es; t.ef=ef; changed=true; }
    });
  }
  var maxEF = arr.length ? Math.max.apply(null, arr.map(function(t){return t.ef;})) : 0;
  arr.forEach(function(t){ t.lf=maxEF; t.ls=maxEF-(parseFloat(t.dur)||0); });
  changed=true; iter=0;
  while (changed && iter++<100) {
    changed=false;
    arr.forEach(function(t){
      arr.forEach(function(s){
        if ((s.preds||[]).indexOf(t.id)>=0 && s.ls<t.lf){
          t.lf=s.ls; t.ls=t.lf-(parseFloat(t.dur)||0); changed=true;
        }
      });
    });
  }
  arr.forEach(function(t){
    t.slack=parseFloat((t.lf-t.ef).toFixed(2));
    t.critical=(t.slack===0);
  });
  var crits=arr.filter(function(t){return t.critical;}).sort(function(a,b){return a.es-b.es;});
  return {maxEF:maxEF, critTasks:crits};
}
function calcPert(){ return calcPertOn(tasks); }

var layoutData = {};

function autoLayout() {
  if (!tasks.length) return;
  var res = calcPert();
  var critSet = {};
  res.critTasks.forEach(function(t){ critSet[t.id]=true; });
  var col={};
  tasks.forEach(function(t){ col[t.id]=0; });
  var changed=true, iter=0;
  while (changed && iter++<100) {
    changed=false;
    tasks.forEach(function(t){
      (t.preds||[]).forEach(function(pid){
        if ((col[pid]||0)+1 > col[t.id]){ col[t.id]=(col[pid]||0)+1; changed=true; }
      });
    });
  }
  var cols={};
  tasks.forEach(function(t){
    var c=col[t.id];
    if (!cols[c]) cols[c]=[];
    cols[c].push(t);
  });
  var colKeys=Object.keys(cols).map(Number).sort(function(a,b){return a-b;});
  var numCols=colKeys.length+1;
  var wrap=document.getElementById('canvas-wrap');
  var canvasW=wrap.clientWidth||390;
  var canvasH=wrap.clientHeight||500;
  var PAD_X=10, PAD_Y=10, MIN_GAP_X=8, MIN_GAP_Y=8;
  var maxAbove=0, maxBelow=0;
  colKeys.forEach(function(c){
    var nc=cols[c].filter(function(t){return !critSet[t.id];});
    maxAbove=Math.max(maxAbove, Math.ceil(nc.length/2));
    maxBelow=Math.max(maxBelow, Math.floor(nc.length/2));
  });
  var totalRows=1+maxAbove+maxBelow;
  var fitW=(canvasW-2*PAD_X-(numCols-1)*MIN_GAP_X)/numCols;
  var nw=Math.min(NODE_W, Math.max(60, fitW));
  var fitH=(canvasH-2*PAD_Y-(totalRows-1)*MIN_GAP_Y)/Math.max(totalRows,1);
  var nh=Math.min(NODE_H, Math.max(50, fitH));
  var totalUsedW=numCols*nw;
  var colGap=numCols>1 ? Math.max(MIN_GAP_X,(canvasW-2*PAD_X-totalUsedW)/(numCols-1)) : 0;
  var rowStep=nh+Math.max(MIN_GAP_Y,(canvasH-2*PAD_Y-totalRows*nh)/Math.max(totalRows-1,1));
  var colX={};
  colKeys.forEach(function(c,i){ colX[c]=PAD_X+i*(nw+colGap); });
  var finColX=PAD_X+(numCols-1)*(nw+colGap);
  var midY=PAD_Y+maxAbove*rowStep;
  colKeys.forEach(function(c){
    var crits=cols[c].filter(function(t){return critSet[t.id];});
    var noncrits=cols[c].filter(function(t){return !critSet[t.id];});
    crits.forEach(function(t,i){
      t.x=colX[c]+i*(nw+4); t.y=midY; t._nw=nw; t._nh=nh;
    });
    noncrits.forEach(function(t,i){
      var above=(i%2===0);
      var band=Math.floor(i/2)+1;
      t.x=colX[c];
      t.y=above ? midY-band*rowStep : midY+band*rowStep;
      t._nw=nw; t._nh=nh;
    });
  });
  layoutData={nw:nw, nh:nh, finX:finColX, finY:midY};
}

var scale=1, offsetX=0, offsetY=0;
var connectMode=false, connectSource=null;

function arrow(svg, x1,y1,x2,y2, isCrit) {
  var cx=Math.max(20,(x2-x1)*0.4);
  var el=document.createElementNS('http://www.w3.org/2000/svg','path');
  el.setAttribute('class','arrow'+(isCrit?' critical':''));
  el.setAttribute('d','M'+x1+','+y1+' C'+(x1+cx)+','+y1+' '+(x2-cx)+','+y2+' '+x2+','+y2);
  el.setAttribute('marker-end', isCrit?'url(#ahc)':'url(#ah)');
  svg.appendChild(el);
}

function applyTransform() {
  var t='translate('+offsetX+'px,'+offsetY+'px) scale('+scale+')';
  document.getElementById('canvas').style.transform=t;
  document.getElementById('canvas').style.transformOrigin='0 0';
  document.getElementById('arrows').style.transform=t;
  document.getElementById('arrows').style.transformOrigin='0 0';
}

function renderGraph() {
  var res=calcPert();
  var canvas=document.getElementById('canvas');
  var svg=document.getElementById('arrows');
  canvas.innerHTML='';
  svg.querySelectorAll('.arrow').forEach(function(e){e.remove();});
  applyTransform();

  var p = currentProj();
  var PRE = unitPrefix(p);
  var SUF = unitSuffix(p);
  var FULL = unitFull(p);

  // Update info bar unit
  document.getElementById('infoDurUnit').textContent = SUF;

  if (!tasks.length) {
    document.getElementById('infoCount').textContent='0';
    document.getElementById('infoDuration').textContent='0';
    document.getElementById('infoCritical').textContent='—';
    return;
  }
  var nw=layoutData.nw||NODE_W, nh=layoutData.nh||NODE_H;
  var finX=layoutData.finX||300, finY=layoutData.finY||100;
  var successorIds={};
  tasks.forEach(function(t){ (t.preds||[]).forEach(function(pid){ successorIds[pid]=true; }); });
  var terminals=tasks.filter(function(t){ return !successorIds[t.id]; });
  var finIsCrit=terminals.some(function(t){return t.critical;});
  tasks.forEach(function(t){
    (t.preds||[]).forEach(function(pid){
      var p=tasks.filter(function(x){return x.id===pid;})[0];
      if (!p) return;
      var isCrit=t.critical&&p.critical;
      var pnw=p._nw||nw, pnh=p._nh||nh, tnh=t._nh||nh;
      arrow(svg, (p.x||0)+pnw,(p.y||0)+pnh/2, (t.x||0),(t.y||0)+tnh/2, isCrit);
    });
  });
  terminals.forEach(function(p){
    var pnw=p._nw||nw, pnh=p._nh||nh;
    var isCrit=p.critical&&finIsCrit;
    arrow(svg, (p.x||0)+pnw,(p.y||0)+pnh/2, finX,finY+nh/2, isCrit);
  });
  tasks.forEach(function(t){
    var tnw=t._nw||nw, tnh=t._nh||nh;
    var fId  =Math.max(7, Math.min(9,  tnw*0.075));
    var fName=Math.max(8, Math.min(12, tnw*0.1));
    var fData=Math.max(7, Math.min(10, tnw*0.083));
    var el=document.createElement('div');
    el.className='node'+(t.critical?' critical':'');
    el.dataset.id=t.id;
    el.style.left =(t.x||0)+'px';
    el.style.top  =(t.y||0)+'px';
    el.style.width =tnw+'px';
    el.style.height=tnh+'px';
    var sc=t.slack===0?'zero':'';
    el.innerHTML='<div class="node-inner">'
      +'<div class="node-id" style="font-size:'+fId+'px">'+t.id+'</div>'
      +'<div class="node-name" style="font-size:'+fName+'px">'+t.name+'</div>'
      +'<div class="node-times" style="font-size:'+fData+'px">'
        +'<span class="node-es">ES:'+t.es+'</span>'
        +' <span class="node-dur">D:'+t.dur+'</span>'
        +' <span class="node-ls">LS:'+(t.ls===Infinity?'?':t.ls)+'</span>'
      +'</div>'
      +'<div class="node-slack '+sc+'" style="font-size:'+fData+'px">marge:'+(t.slack===Infinity?'?':t.slack)+SUF+'</div>'
      +'</div>';
    canvas.appendChild(el);
    addNodeInteraction(el, t);
  });
  var fFin=Math.max(10, Math.min(15, nw*0.12));
  var finEl=document.createElement('div');
  finEl.className='node fin-node'+(finIsCrit?' critical':'');
  finEl.style.left  =finX+'px';
  finEl.style.top   =finY+'px';
  finEl.style.width =nw+'px';
  finEl.style.height=nh+'px';
  finEl.style.alignItems='center';
  finEl.style.justifyContent='center';
  finEl.innerHTML='<div style="text-align:center">'
    +'<div style="font-family:Syne,sans-serif;font-size:'+fFin+'px;font-weight:800;'
      +'color:'+(finIsCrit?'var(--critical)':'var(--accent)')+'">FIN</div>'
    +'<div style="font-size:'+(fFin*0.8)+'px;color:var(--accent);margin-top:2px">'+PRE+res.maxEF+'</div>'
    +'</div>';
  canvas.appendChild(finEl);
  document.getElementById('infoCount').textContent=tasks.length;
  document.getElementById('infoDuration').textContent=res.maxEF;
  document.getElementById('infoCritical').textContent=
    res.critTasks.length ? res.critTasks.map(function(t){return t.name;}).join(' > ') : '—';
}

function addNodeInteraction(el, task) {
  el.addEventListener('click', function(){
    if (connectMode) {
      if (!connectSource) {
        connectSource=task.id;
        el.style.outline='2px solid var(--accent)';
      } else if (connectSource!==task.id) {
        if (!task.preds) task.preds=[];
        if (task.preds.indexOf(connectSource)<0) task.preds.push(connectSource);
        saveTasks(); renderGraph();
        connectSource=null;
        document.querySelectorAll('.node').forEach(function(n){n.style.outline='';});
      }
      return;
    }
    openDetailTask(task.id);
  });
  var startTX,startTY,startX,startY,isDragging=false;
  el.addEventListener('touchstart',function(e){
    var t=e.touches[0];
    startTX=t.clientX; startTY=t.clientY;
    startX=task.x||0; startY=task.y||0;
    isDragging=false;
  },{passive:true});
  el.addEventListener('touchmove',function(e){
    e.stopPropagation();
    var t=e.touches[0];
    var dx=(t.clientX-startTX)/scale;
    var dy=(t.clientY-startTY)/scale;
    if (!isDragging&&Math.abs(dx)+Math.abs(dy)>5) isDragging=true;
    if (isDragging) {
      task.x=Math.max(0,startX+dx); task.y=Math.max(0,startY+dy);
      el.style.left=task.x+'px'; el.style.top=task.y+'px';
      renderArrows();
    }
  },{passive:true});
  el.addEventListener('touchend',function(){
    if (isDragging){ saveTasks(); renderGraph(); }
  });
}

var detailTaskId = null;

function openDetailTask(id) {
  var t = tasks.filter(function(x){return x.id===id;})[0];
  if (!t) return;
  detailTaskId = id;
  calcPert();

  var p   = currentProj();
  var PRE = unitPrefix(p);
  var SUF = unitSuffix(p);
  var FUL = unitFull(p);

  var isCrit = t.critical;
  var slack   = t.slack===Infinity ? '?' : t.slack;
  var ls      = t.ls===Infinity    ? '?' : t.ls;
  var lf      = t.lf===Infinity    ? '?' : t.lf;

  var predNames = (t.preds||[]).map(function(pid){
    var p=tasks.filter(function(x){return x.id===pid;})[0];
    return p ? '<span class="pred-tag">'+p.id+' '+p.name+'</span>' : '';
  }).join('');
  var succNames = tasks.filter(function(s){
    return (s.preds||[]).indexOf(t.id)>=0;
  }).map(function(s){
    return '<span class="pred-tag">'+s.id+' '+s.name+'</span>';
  }).join('');

  var explain = '';
  if ((t.preds||[]).length===0) {
    explain = 'Cette t&acirc;che n\'a pas d\'ant&eacute;c&eacute;dent : elle peut d&eacute;marrer d&egrave;s <b>'+PRE+'0</b>.';
  } else {
    var predList = (t.preds||[]).map(function(pid){
      var pp=tasks.filter(function(x){return x.id===pid;})[0];
      return pp ? '<b>'+pp.name+'</b> (finit &agrave; '+PRE+pp.ef+')' : '';
    }).join(', ');
    explain = 'Elle attend la fin de '+predList
      +'. Elle peut donc d&eacute;marrer au plus t&ocirc;t &agrave; <b>'+PRE+t.es+'</b>'
      +' et se terminer &agrave; <b>'+PRE+t.ef+'</b> (ES + '+t.dur+SUF+').';
  }
  if (isCrit) {
    explain += ' <b>Marge z&eacute;ro :</b> tout retard sur cette t&acirc;che retarde la fin du projet.';
  } else {
    explain += ' Elle dispose de <b>'+slack+SUF+' de marge</b> : elle peut glisser sans impact sur la date de fin.';
  }

  var badge = isCrit
    ? '<div class="detail-critical-badge">&#9888; Chemin critique &mdash; marge 0</div>'
    : '<div class="detail-ok-badge">&#10003; Hors chemin critique</div>';

  document.getElementById('detailContent').innerHTML =
    '<div class="detail-id">'+t.id+'</div>'
    +'<div class="detail-title">'+t.name+'</div>'
    +badge
    +'<div class="detail-grid">'
      +'<div class="detail-cell ok">'
        +'<div class="detail-label">ES &mdash; D&eacute;but au plus t&ocirc;t</div>'
        +(t.dateES
          ? '<div class="detail-value green" style="font-size:14px">'+t.dateES.split("-").reverse().join("/")+'</div><div class="detail-sub">'+PRE+t.es+' &mdash; 1er '+FUL.replace(/s$/,'')+' possible</div>'
          : '<div class="detail-value green">'+PRE+t.es+'</div><div class="detail-sub">1er '+FUL.replace(/s$/,'')+' possible</div>'
        )
      +'</div>'
      +'<div class="detail-cell ok">'
        +'<div class="detail-label">EF &mdash; Fin au plus t&ocirc;t</div>'
        +(t.dateEF
          ? '<div class="detail-value green" style="font-size:14px">'+t.dateEF.split("-").reverse().join("/")+'</div><div class="detail-sub">'+PRE+t.ef+' &mdash; ES + '+t.dur+SUF+'</div>'
          : '<div class="detail-value green">'+PRE+t.ef+'</div><div class="detail-sub">ES + '+t.dur+SUF+'</div>'
        )
      +'</div>'
      +'<div class="detail-cell'+(isCrit?' critical':'')+'">'
        +'<div class="detail-label">LS &mdash; D&eacute;but au plus tard</div>'
        +(t.dateLS
          ? '<div class="detail-value'+(isCrit?' red':' accent3')+'" style="font-size:14px">'+t.dateLS.split("-").reverse().join("/")+'</div><div class="detail-sub">'+PRE+ls+' &mdash; Sans retarder le projet</div>'
          : '<div class="detail-value'+(isCrit?' red':' accent3')+'">'+PRE+ls+'</div><div class="detail-sub">Sans retarder le projet</div>'
        )
      +'</div>'

function renderArrows() {

  var nw=layoutData.nw||NODE_W, nh=layoutData.nh||NODE_H;
  var finX=layoutData.finX||300, finY=layoutData.finY||100;
  var successorIds={};
  tasks.forEach(function(t){ (t.preds||[]).forEach(function(pid){successorIds[pid]=true;}); });
  var terminals=tasks.filter(function(t){return !successorIds[t.id];});
  var finIsCrit=terminals.some(function(t){return t.critical;});
  tasks.forEach(function(t){
    (t.preds||[]).forEach(function(pid){
      var p=tasks.filter(function(x){return x.id===pid;})[0];
      if (!p) return;
      var pnw=p._nw||nw, pnh=p._nh||nh, tnh=t._nh||nh;
      arrow(svg,(p.x||0)+pnw,(p.y||0)+pnh/2,(t.x||0),(t.y||0)+tnh/2,t.critical&&p.critical);
    });
  });
  terminals.forEach(function(p){
    var pnw=p._nw||nw, pnh=p._nh||nh;
    arrow(svg,(p.x||0)+pnw,(p.y||0)+pnh/2,finX,finY+nh/2,p.critical&&finIsCrit);
  });
}

function parseDate(s){ var p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function formatDate(d){
  var y=d.getFullYear(), m=d.getMonth()+1, dd=d.getDate();
  return y+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd;
}
function formatDateFR(d){
  var dd=d.getDate(), m=d.getMonth()+1, y=d.getFullYear();
  return (dd<10?'0':'')+dd+'/'+(m<10?'0':'')+m+'/'+y;
}
function isWorkday(d){ var w=d.getDay(); return w>=1&&w<=5; }

var calMode = 'all';

function addWorkdays(d, n){
  if(calMode==='all'){
    var r=new Date(d); r.setDate(r.getDate()+n); return r;
  }
  var r=new Date(d); var step=n>=0?1:-1; var remaining=Math.abs(n);
  while(remaining>0){ r.setDate(r.getDate()+step); if(isWorkday(r)) remaining--; }
  return r;
}

function pertDayToDate(anchor, pertDay){
  if(pertDay===0) return new Date(anchor);
  return addWorkdays(new Date(anchor), pertDay);
}

function computeCalendarDates(proj){
  var anchor = proj.dateAnchor ? parseDate(proj.dateAnchor) : null;
  if(!anchor || !proj.tasks||!proj.tasks.length) return;
  calcPertOn(proj.tasks);
  var maxEF = Math.max.apply(null, proj.tasks.map(function(t){return t.ef;}));
  if(proj.dateMode==='end'){
    var realStart = addWorkdays(new Date(anchor), -maxEF);
    proj.tasks.forEach(function(t){
      var dateES, dateEF, dateLS, dateLF;
      if(t.ef === maxEF){
        dateEF = new Date(anchor);
        dateES = addWorkdays(new Date(anchor), -(t.dur));
      } else {
        dateES = pertDayToDate(realStart, t.es);
        dateEF = pertDayToDate(realStart, t.ef);
      }
      var ls = t.ls===Infinity?t.es:t.ls;
      var lf = t.lf===Infinity?t.ef:t.lf;
      if(lf === maxEF){
        dateLF = new Date(anchor);
        dateLS = addWorkdays(new Date(anchor), -(t.dur));
      } else {
        dateLS = pertDayToDate(realStart, ls);
        dateLF = pertDayToDate(realStart, lf);
      }
      t.dateES = formatDate(dateES);
      t.dateEF = formatDate(dateEF);
      t.dateLS = formatDate(dateLS);
      t.dateLF = formatDate(dateLF);
    });
    proj._realStart = formatDate(addWorkdays(new Date(anchor), -maxEF));
    proj._realEnd   = formatDate(anchor);
  } else {
    proj.tasks.forEach(function(t){
      t.dateES = formatDate(pertDayToDate(anchor, t.es));
      t.dateEF = formatDate(pertDayToDate(anchor, t.ef));
      t.dateLS = formatDate(pertDayToDate(anchor, t.ls===Infinity?t.es:t.ls));
      t.dateLF = formatDate(pertDayToDate(anchor, t.lf===Infinity?t.ef:t.lf));
    });
    proj._realStart = formatDate(anchor);
    proj._realEnd   = formatDate(pertDayToDate(anchor, maxEF));
  }
}

function timeToMinutes(hhmm){
  var p=hhmm.split(':'); return parseInt(p[0])*60+parseInt(p[1]);
}
function minutesToHHMM(mins){
  // Handle negative or >24h by wrapping
  var total = ((Math.round(mins) % 1440) + 1440) % 1440;
  var h=Math.floor(total/60), m=total%60;
  return (h<10?'0':'')+h+':'+(m<10?'0':'')+m;
}

function computeTimeDates(proj){
  var anchor = proj.dateAnchor;
  if(!anchor || !proj.tasks||!proj.tasks.length) return;
  var unit = proj.unit||'day';
  calcPertOn(proj.tasks);
  var maxEF = Math.max.apply(null, proj.tasks.map(function(t){return t.ef;}));
  var anchorMins = timeToMinutes(anchor);
  var toMins = unit==='min' ? 1 : 60;
  var startMins;
  if(proj.dateMode==='end'){
    startMins = anchorMins - maxEF*toMins;
  } else {
    startMins = anchorMins;
  }
  proj.tasks.forEach(function(t){
    var ls = t.ls===Infinity?t.es:t.ls;
    var lf = t.lf===Infinity?t.ef:t.lf;
    t.dateES = minutesToHHMM(startMins + t.es*toMins);
    t.dateEF = minutesToHHMM(startMins + t.ef*toMins);
    t.dateLS = minutesToHHMM(startMins + ls*toMins);
    t.dateLF = minutesToHHMM(startMins + lf*toMins);
  });
  proj._realStart = minutesToHHMM(startMins);
  proj._realEnd   = minutesToHHMM(startMins + maxEF*toMins);
}

function openProject(id) {
  currentProjId=id;
  var p=currentProj();
  if (!p) return;
  calMode = p.calMode||'all';
  var pUnit = p.unit||'day';
  if(p.dateAnchor && p.tasks&&p.tasks.length){
    if(pUnit==='min'||pUnit==='hour') computeTimeDates(p);
    else computeCalendarDates(p);
  }
  tasks=JSON.parse(JSON.stringify(p.tasks||[]));
  document.getElementById('headerProjName').textContent=p.name;
  var sub=p.desc||'';
  if(p._realStart&&p._realEnd) sub+=(sub?' · ':'')+p._realStart+' → '+p._realEnd;
  document.getElementById('headerProjSub').textContent=sub;

  // Update duration label in task modal
  var SUF = unitSuffix(p);
  document.getElementById('fDurLabel').textContent='DURÉE ('+unitFull(p)+')';
  document.getElementById('fDur').placeholder = pUnit==='min'?'30':pUnit==='hour'?'2':'5';

  document.getElementById('projectScreen').style.display='none';
  document.getElementById('appScreen').classList.add('visible');
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  document.querySelectorAll('.view').forEach(function(v){v.classList.remove('active');});
  document.querySelector('.tab[data-view="graph"]').classList.add('active');
  document.getElementById('view-graph').classList.add('active');
  scale=1; offsetX=0; offsetY=0;
  connectMode=false; connectSource=null;
  document.getElementById('connectBanner').classList.remove('show');
  setTimeout(function(){ autoLayout(); saveTasks(); renderGraph(); }, 60);
}

  var preds=[];

  if (editingTaskId) {
    var t=tasks.filter(function(x){return x.id===editingTaskId;})[0];
    if (t){ t.name=name; t.dur=dur; t.preds=preds; }
  } else {
    tasks.push({id:genId(),name:name,dur:dur,preds:preds,x:20,y:20});
  }
  autoLayout(); saveTasks();
  var cp=currentProj();
  if(cp && cp.dateAnchor){
    var cpUnit=cp.unit||'day';
    if(cpUnit==='min'||cpUnit==='hour') computeTimeDates(cp);
    else computeCalendarDates(cp);
    tasks=JSON.parse(JSON.stringify(cp.tasks||[]));

  document.getElementById('modalTask').classList.remove('open');
  renderGraph();

  tasks=tasks.filter(function(t){return t.id!==id;});
  tasks.forEach(function(t){ t.preds=(t.preds||[]).filter(function(p){return p!==id;}); });
  autoLayout(); saveTasks(); renderGraph(); renderTaskList();
}

function previewSettingsDates(){
  var res = document.getElementById('sDateResult');
  var isTime = (settingsUnit==='min'||settingsUnit==='hour');
  var anchorVal = isTime ? document.getElementById('sTime').value : document.getElementById('sDate').value;
  if(!anchorVal || !tasks.length){ res.style.display='none'; return; }
  var tempTasks = JSON.parse(JSON.stringify(tasks));
  calcPertOn(tempTasks);
  var maxEF = Math.max.apply(null, tempTasks.map(function(t){return t.ef;}));
  if(isTime){
    var anchorMins = timeToMinutes(anchorVal);
    var totalMins = settingsUnit==='min' ? maxEF : maxEF*60;
    var startMins, endMins;
    if(settingsMode==='end'){ endMins=anchorMins; startMins=anchorMins-totalMins; }
    else { startMins=anchorMins; endMins=anchorMins+totalMins; }
    res.style.display='block';
    res.innerHTML = '&#128336; D\u00e9but : <b style="color:var(--accent)">'+minutesToHHMM(startMins)+'</b><br>'
      +'&#127937; Fin : <b style="color:var(--accent)">'+minutesToHHMM(endMins)+'</b><br>'
      +'&#9203; Dur\u00e9e totale : <b style="color:var(--accent)">'+(settingsUnit==='min'?totalMins+'min':maxEF+'h')+'</b>';
  } else {
    var anchor = parseDate(anchorVal);
    var startDate, endDate;
    if(settingsMode==='end'){ endDate=anchor; startDate=addWorkdays(new Date(anchor),-maxEF); }
    else { startDate=anchor; endDate=addWorkdays(new Date(anchor),maxEF); }
    var calLabel = (settingsCal==='all') ? 'jours calendaires' : 'jours ouvr\u00e9s';
    res.style.display='block';
    res.innerHTML = '&#128197; D\u00e9but : <b style="color:var(--accent)">'+formatDateFR(startDate)+'</b><br>'
      +'&#127937; Fin : <b style="color:var(--accent)">'+formatDateFR(endDate)+'</b><br>'
      +'&#9203; Dur\u00e9e : <b style="color:var(--accent)">'+maxEF+' '+calLabel+'</b>';
  }
}

function exportPDF() {
  var p   = currentProj();
  if (!p || !tasks.length) { alert('Aucune tâche à exporter.'); return; }

  // Sync real dates from project tasks into working tasks array
  if (p.dateAnchor) {
    var pUnit2 = p.unit||'day';
    if (pUnit2==='min'||pUnit2==='hour') computeTimeDates(p);
    else computeCalendarDates(p);
    // Copy dateES/EF/LS/LF into working tasks
    tasks.forEach(function(t){
      var pt = (p.tasks||[]).filter(function(x){return x.id===t.id;})[0];
      if (pt) { t.dateES=pt.dateES; t.dateEF=pt.dateEF; t.dateLS=pt.dateLS; t.dateLF=pt.dateLF; }
    });
  }

  var res  = calcPert();
  var PRE  = unitPrefix(p);
  var SUF  = unitSuffix(p);
  var FULL = unitFull(p);

  var sorted = tasks.slice().sort(function(a,b){ return a.es-b.es; });

  // Build Gantt SVG (inline in PDF)
  var maxEF = res.maxEF;
  var colW  = 18;
  var rowH  = 22;
  var lblW  = 120;
  var svgW  = lblW + (maxEF+1)*colW;
  var svgH  = 28 + sorted.length * rowH;

  var svgRows = '';
  // Grid header
  for (var c = 0; c <= maxEF; c++) {
    svgRows += '<rect x="'+(lblW+c*colW)+'" y="0" width="'+colW+'" height="24" fill="'+(c%2===0?'#1a2540':'#1e2d47')+'"/>';
    svgRows += '<text x="'+(lblW+c*colW+colW/2)+'" y="16" text-anchor="middle" font-size="7" fill="#6a7fa0">'+PRE+c+'</text>';
  }
  // Task rows
  sorted.forEach(function(t, i) {
    var y = 26 + i*rowH;
    // Row bg
    svgRows += '<rect x="0" y="'+y+'" width="'+svgW+'" height="'+rowH+'" fill="'+(i%2===0?'#0e1628':'#1e2d47')+'"/>';
    // Grid cells
    for (var c2=0;c2<=maxEF;c2++) {
      svgRows += '<rect x="'+(lblW+c2*colW)+'" y="'+y+'" width="'+colW+'" height="'+rowH+'" fill="none" stroke="#2e3d5a" stroke-width="0.3"/>';
    }
    // Label
    var lbl = t.name.length > 16 ? t.name.slice(0,15)+'…' : t.name;
    svgRows += '<text x="4" y="'+(y+rowH/2+4)+'" font-size="8" fill="'+(t.critical?'#e05c7a':'#e8eef5')+'">'+lbl+'</text>';
    // ES bar
    var bx = lblW + t.es*colW;
    var bw = Math.max(colW*0.5, t.dur*colW);
    svgRows += '<rect x="'+bx+'" y="'+(y+4)+'" width="'+bw+'" height="'+(rowH-8)+'" rx="3" fill="'+(t.critical?'#e05c7a':'#f5a623')+'"/>';
    // Slack bar
    if (t.slack>0 && t.slack!==Infinity) {
      var sx = lblW + t.ef*colW;
      var sw2 = t.slack*colW;
      svgRows += '<rect x="'+sx+'" y="'+(y+6)+'" width="'+sw2+'" height="'+(rowH-12)+'" rx="2" fill="none" stroke="#6a7fa0" stroke-width="1" stroke-dasharray="2,2"/>';
    }
  });
  var ganttSVG = '<svg xmlns="http://www.w3.org/2000/svg" width="'+svgW+'" height="'+svgH+'" viewBox="0 0 '+svgW+' '+svgH+'">'+svgRows+'</svg>';
  var ganttB64 = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(ganttSVG)));

  // French date/time formatter
  function fmtFR(val) {
    if (!val) return null;
    // HH:MM — return as-is (already French format)
    if (val.match(/^\d{2}:\d{2}$/)) return val;
    // YYYY-MM-DD → jj/mm/aaaa
    if (val.match(/^\d{4}-\d{2}-\d{2}$/)) {
      var pts = val.split('-');
      return pts[2]+'/'+pts[1]+'/'+pts[0];
    }
    return val;
  }

  // Build task table rows with French dates
  var tableRows = sorted.map(function(t) {
    var pnames = (t.preds||[]).map(function(pid){
      var pp=tasks.filter(function(x){return x.id===pid;})[0]; return pp?pp.id:'?';
    }).join(', ') || '\u2014';
    var isCrit  = t.critical;
    var rowBg   = isCrit ? '#fff0f0' : '#ffffff';
    var idColor = isCrit ? '#c0392b' : '#1a1a2e';
    var nmColor = isCrit ? '#c0392b' : '#1a1a2e';
    var realES  = fmtFR(t.dateES) || PRE+t.es;
    var realEF  = fmtFR(t.dateEF) || PRE+t.ef;
    var realLS  = fmtFR(t.dateLS) || PRE+(t.ls===Infinity?'?':t.ls);
    return '<tr style="background:'+rowBg+'">'
      +'<td style="color:'+idColor+';font-weight:700">'+t.id+'</td>'
      +'<td style="color:'+nmColor+';font-weight:'+(isCrit?'700':'400')+'">'+t.name+'</td>'
      +'<td style="text-align:center;color:#333">'+t.dur+SUF+'</td>'
      +'<td style="text-align:center;color:#1a6b2a;font-weight:600">'+realES+'</td>'
      +'<td style="text-align:center;color:#1a6b2a;font-weight:600">'+realEF+'</td>'
      +'<td style="text-align:center;color:#1a5c8a;font-weight:600">'+realLS+'</td>'
      +'<td style="text-align:center;color:'+(t.slack===0?'#c0392b':'#1a6b2a')+';font-weight:700">'+t.slack+SUF+'</td>'
      +'<td style="color:#555">'+pnames+'</td>'
      +'</tr>';
  }).join('');

  // Critical path
  var cpText = res.critTasks.map(function(t){return t.id+' '+t.name;}).join(' \u2192 ');

  // Stats
  var noCrit = tasks.filter(function(t){return !t.critical;});

  // Date info line in French
  var dateInfo = '';
  if (p._realStart && p._realEnd) {
    var startFR = fmtFR(p._realStart) || p._realStart;
    var endFR   = fmtFR(p._realEnd)   || p._realEnd;
    var ancFR   = fmtFR(p.dateAnchor) || p.dateAnchor;
    dateInfo = '<p style="margin:0 0 8px;font-size:11px;color:#1a5c8a">&#128197; '
      +(p.dateMode==='end'?'Date de fin\u00a0: ':'Date de d\u00e9but\u00a0: ')
      +'<b>'+ancFR+'</b> &nbsp;| P\u00e9riode\u00a0: <b>'+startFR+' \u2192 '+endFR+'</b></p>';
  }

  var now = new Date().toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});

  var html = '<!DOCTYPE html><html lang="fr"><head>'
    +'<meta charset="UTF-8">'
    +'<title>PERT - '+p.name+'</title>'
    +'<style>'
    +'*{box-sizing:border-box;margin:0;padding:0}'
    +'body{font-family:Arial,sans-serif;font-size:11px;background:#fff;color:#1a1a2e;padding:20px}'
    +'h1{font-size:20px;color:#1a1a2e;margin-bottom:4px}'
    +'h2{font-size:13px;color:#b07800;margin:18px 0 8px;border-bottom:2px solid #f5a623;padding-bottom:4px;text-transform:uppercase;letter-spacing:1px}'
    +'.meta{font-size:10px;color:#555;margin-bottom:14px}'
    +'.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}'
    +'.stat-box{background:#f5f7fa;border-radius:8px;padding:10px 12px;border-left:3px solid #f5a623}'
    +'.stat-label{font-size:9px;color:#666;text-transform:uppercase;letter-spacing:0.5px}'
    +'.stat-val{font-size:20px;font-weight:800;color:#1a1a2e;line-height:1.2}'
    +'.cp-box{background:#fff5f5;border:1px solid #c0392b;border-radius:8px;padding:10px 12px;margin-bottom:10px;font-size:11px;color:#c0392b;font-weight:600}'
    +'table{width:100%;border-collapse:collapse;margin-bottom:6px}'
    +'th{background:#1a2540;color:#f5a623;font-size:9px;padding:7px 8px;text-align:left;letter-spacing:0.5px;text-transform:uppercase}'
    +'td{padding:5px 8px;border-bottom:1px solid #dde3ec;font-size:10px;color:#1a1a2e}'
    +'tr:nth-child(even) td{background:#f5f7fa}'
    +'.gantt-section{page-break-before:always}'
    +'.gantt-bg{background:#0e1628;border-radius:8px;padding:10px;display:inline-block;max-width:100%}'
    +'.footer{margin-top:16px;font-size:9px;color:#888;text-align:right;border-top:1px solid #dde;padding-top:6px}'
    +'@media print{body{padding:8px}.gantt-section{page-break-before:always}button{display:none!important}}'
    +'</style></head><body>'

    +'<h1>&#9672; '+p.name+'</h1>'
    +'<div class="meta">'+(p.desc?p.desc+' &nbsp;|&nbsp; ':'')+FULL+' &nbsp;|&nbsp; G\u00e9n\u00e9r\u00e9 le '+now+'</div>'
    +dateInfo

    +'<h2>R\u00e9sum\u00e9</h2>'
    +'<div class="stats">'
      +'<div class="stat-box"><div class="stat-label">Dur\u00e9e totale</div><div class="stat-val">'+res.maxEF+'<span style="font-size:13px;font-weight:400"> '+SUF+'</span></div></div>'
      +'<div class="stat-box"><div class="stat-label">T\u00e2ches</div><div class="stat-val">'+tasks.length+'</div></div>'
      +'<div class="stat-box" style="border-left-color:#c0392b"><div class="stat-label">Sur chemin critique</div><div class="stat-val" style="color:#c0392b">'+res.critTasks.length+'</div></div>'
    +'</div>'
    +'<div class="cp-box">&#9888; Chemin critique\u00a0: '+cpText+'</div>'

    +'<h2>Toutes les t\u00e2ches</h2>'
    +'<table><thead><tr>'
      +'<th>ID</th><th>Nom</th><th>Dur\u00e9e</th>'
      +'<th>D\u00e9but (ES)</th><th>Fin (EF)</th><th>Au + tard (LS)</th><th>Marge</th><th>Ant\u00e9c\u00e9dents</th>'
    +'</tr></thead><tbody>'+tableRows+'</tbody></table>'

    +'<div class="gantt-section">'
    +'<h2>Diagramme de Gantt</h2>'
    +'<div class="gantt-bg"><img src="'+ganttB64+'" style="max-width:100%;display:block"/></div>'
    +'</div>'

    +'<div class="footer">PERT &amp; GANTT Planner \u2014 '+p.name+' \u2014 '+now+'</div>'

    +'<div style="text-align:center;margin-top:20px">'
      +'<button onclick="window.print()" style="background:#f5a623;border:none;border-radius:8px;padding:12px 28px;font-size:13px;font-weight:700;cursor:pointer;color:#0e1628">&#128424; Imprimer / Enregistrer en PDF</button>'
      +'<button onclick="window.close()" style="background:#eee;border:none;border-radius:8px;padding:12px 16px;font-size:12px;cursor:pointer;margin-left:8px;color:#333">Fermer</button>'
    +'</div>'
    +'</body></html>';

    // Always use blob URL — works on iPhone Safari AND desktop
  var blob = new Blob([html], {type: 'text/html;charset=utf-8'});
  var url  = URL.createObjectURL(blob);
  // Try to open in new tab first
  var win  = window.open(url, '_blank');
  if (!win) {
    // Safari popup blocker fallback: use invisible link click
    var a = document.createElement('a');
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }
  // Revoke after short delay
  setTimeout(function(){ URL.revokeObjectURL(url); }, 10000);
}

// GANTT
// ══════════════════════════════════════════
function renderGantt() {
  var container = document.getElementById('ganttContainer');
  if (!tasks.length) {
    container.innerHTML = '<div class="empty-state" style="padding:40px;width:100%"><div class="icon">&#128200;</div>Ajoutez des t&acirc;ches pour voir le Gantt.</div>';
    return;
  }

  var res = calcPert();
  var p   = currentProj();
  var PRE = unitPrefix(p);
  var SUF = unitSuffix(p);
  var pUnit = (p && p.unit) ? p.unit : 'day';
  var isTime = (pUnit === 'min' || pUnit === 'hour');
  var maxEF  = res.maxEF;
  var totalCols = maxEF + 1; // col 0..maxEF inclusive

  // Column width: adapt to screen — wider for few cols, narrower for many
  var scrollW = document.getElementById('ganttScroll').clientWidth || 280;
  var availW  = scrollW - 110; // minus labels
  var colW    = Math.max(22, Math.min(54, Math.floor(availW / totalCols)));

  // Sort tasks by ES then name
  var sorted = tasks.slice().sort(function(a,b){
    return a.es !== b.es ? a.es - b.es : a.name.localeCompare(b.name);
  });

  // Header label for each column
  function colLabel(i) {
    if (!isTime && p && p.dateAnchor && p._realStart) {
      // Show date
      try {
        var calOld = calMode;
        calMode = p.calMode || 'all';
        var anchor = parseDate(p._realStart);
        var d = pertDayToDate(anchor, i);
        calMode = calOld;
        var day = d.getDate(), mon = d.getMonth()+1;
        // Only show every Nth col to avoid overlap
        var step = colW < 30 ? Math.ceil(maxEF / 8) : colW < 40 ? 2 : 1;
        if (i % step !== 0) return '';
        return (day < 10 ? '0' : '') + day + '/' + (mon < 10 ? '0' : '') + mon;
      } catch(e) { return PRE + i; }
    }
    if (isTime && p && p.dateAnchor && p._realStart) {
      var toMins = pUnit === 'min' ? 1 : 60;
      var startM = timeToMinutes(p._realStart);
      var step2  = colW < 30 ? Math.ceil(maxEF / 8) : colW < 40 ? 2 : 1;
      if (i % step2 !== 0) return '';
      return minutesToHHMM(startM + i * toMins);
    }
    var step3 = colW < 30 ? Math.ceil(maxEF / 8) : colW < 40 ? 2 : 1;
    if (i % step3 !== 0) return '';
    return PRE + i;
  }

  // Is col a weekend (day mode only)?
  function isWeekend(i) {
    if (isTime || !p || !p._realStart) return false;
    try {
      var anchor = parseDate(p._realStart);
      var d = pertDayToDate(anchor, i);
      var w = d.getDay();
      return w === 0 || w === 6;
    } catch(e) { return false; }
  }

  // Is col today?
  function isToday(i) {
    if (isTime || !p || !p._realStart) return false;
    try {
      var anchor = parseDate(p._realStart);
      var d = pertDayToDate(anchor, i);
      var now = new Date();
      return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth() && d.getDate()===now.getDate();
    } catch(e) { return false; }
  }

  // Build HTML
  var labelsHtml = '<div class="gantt-label-header">T&acirc;ches</div>';
  var gridHeaderHtml = '<div class="gantt-header-row">';
  for (var c = 0; c <= maxEF; c++) {
    var lbl = colLabel(c);
    var todayCls = isToday(c) ? ' today' : '';
    gridHeaderHtml += '<div class="gantt-col-head'+todayCls+'" style="width:'+colW+'px;min-width:'+colW+'px">'+lbl+'</div>';
  }
  gridHeaderHtml += '</div>';

  var rowsHtml = '';
  sorted.forEach(function(t) {
    var isCrit = t.critical;
    var dotColor = isCrit ? 'var(--critical)' : 'var(--accent)';
    labelsHtml += '<div class="gantt-label-row" onclick="openDetailTask(\''+t.id+'\')">'
      + '<div class="gantt-legend-dot" style="background:'+dotColor+'"></div>'
      + '<span class="gantt-label-text'+(isCrit?' critical':'')+'">'+t.name+'</span>'
      + '</div>';

    // Grid cells
    rowsHtml += '<div class="gantt-row">';
    for (var c2 = 0; c2 <= maxEF; c2++) {
      var wkCls = isWeekend(c2) ? ' weekend' : '';
      var tdyCls = isToday(c2) ? ' today-col' : '';
      rowsHtml += '<div class="gantt-cell'+wkCls+tdyCls+'" style="width:'+colW+'px;min-width:'+colW+'px"></div>';
    }

    // ES bar (task duration)
    var barLeft  = t.es * colW;
    var barWidth = Math.max(colW * 0.4, t.dur * colW);
    rowsHtml += '<div class="gantt-bar-wrap" style="left:'+(barLeft+110)+'px;width:'+barWidth+'px" onclick="openDetailTask(\''+t.id+'\')">'
      + '<div class="gantt-bar es'+(isCrit?' critical':'')+(t.dur > 0 ? '' : ' slack')+'">'+t.name+'</div>'
      + '</div>';

    // Slack bar (marge)
    if (t.slack > 0 && t.slack !== Infinity) {
      var slackLeft  = t.ef * colW;
      var slackWidth = t.slack * colW;
      rowsHtml += '<div class="gantt-bar-wrap" style="left:'+(slackLeft+110)+'px;width:'+slackWidth+'px" onclick="openDetailTask(\''+t.id+'\')">'
        + '<div class="gantt-bar slack">+'+t.slack+SUF+'</div>'
        + '</div>';
    }

    rowsHtml += '</div>';
  });

  // Today vertical line
  var todayLineHtml = '';
  for (var c3 = 0; c3 <= maxEF; c3++) {
    if (isToday(c3)) {
      todayLineHtml = '<div class="gantt-today-line" style="left:'+(110+c3*colW+colW/2)+'px"></div>';
      break;
    }
  }

  container.innerHTML =
    '<div class="gantt-labels">'+labelsHtml+'</div>'
    + '<div class="gantt-grid" style="width:'+(totalCols*colW)+'px;min-width:'+(totalCols*colW)+'px;position:relative">'
      + gridHeaderHtml
      + rowsHtml
      + todayLineHtml
    + '</div>';

  // Auto-scroll to today
  setTimeout(function() {
    for (var ci = 0; ci <= maxEF; ci++) {
      if (isToday(ci)) {
        var sc = document.getElementById('ganttScroll');
        sc.scrollLeft = Math.max(0, 110 + ci * colW - sc.clientWidth / 2);
        break;
      }
    }
  }, 50);
}
